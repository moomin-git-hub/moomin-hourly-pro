// ---- Tekshirib tozalash (lokal fayl, import va bulutdan kelgan ma'lumot uchun bir xil) ----
function tozaYozuv(r){
  if(!r || typeof r !== "object" || !isIso(r.sana)) return null;
  const d = Math.round(+r.daqiqa);
  if(!(d > 0)) return null;
  const o = {id: String(r.id || uid()).slice(0, 64), sana: r.sana, tur: r.tur === "kirim" ? "kirim" : "chiqim",
    kat: String(r.kat || "15 Boshqa").slice(0, 120), daqiqa: Math.min(d, KUNLIK), izoh: String(r.izoh || "").slice(0, 500)};
  if(r.vaqt && hmToMin(r.vaqt) != null) o.vaqt = r.vaqt;
  if(+r.u > 0) o.u = +r.u;
  return o;
}
function tozaCfg(name, v){
  const arr = x => Array.isArray(x) ? x : (x && typeof x === "object" ? Object.values(x) : []);
  switch(name){
    case "byudjet": { const o = {...VBUDJET}; if(v && typeof v === "object") for(const g of GURUH_TARTIB){ const n = Math.round(+v[g]); if(n >= 0 && n <= KUNLIK) o[g] = n; } return o; }
    case "shablonlar": return arr(v).filter(s => s && s.kat && +s.daqiqa > 0).map(s => ({nom: String(s.nom || katNom(s.kat)).slice(0, 60), kat: String(s.kat).slice(0, 120), daqiqa: Math.min(Math.round(+s.daqiqa), KUNLIK)})).slice(0, 60);
    case "sozlama": { const o = {...SOZLAMA_STD}; if(v && typeof v === "object"){
        o.eslatma = !!v.eslatma; if(hmToMin(v.vaqt) != null) o.vaqt = v.vaqt; o.som = Math.max(0, Math.round(+v.som) || 0);
        for(const k of ["tovush","vibra","effekt"]) if(typeof v[k] === "boolean") o[k] = v[k];
        o.alifbo = v.alifbo === "kiril" ? "kiril" : "lotin";
        if(["avto","oddiy","navroz","mustaqillik","ramazon"].includes(v.mavsum)) o.mavsum = v.mavsum;
        if(Array.isArray(v.yashirin)) o.yashirin = v.yashirin.filter(x => typeof x === "string").slice(0, 60);
      } return o; }
    case "timer": { const o = {...TIMER_STD}; if(v && typeof v === "object"){ o.ish = !!v.ish; o.start = +v.start || 0; o.baza = Math.max(0, +v.baza || 0); if(v.kat) o.kat = String(v.kat).slice(0, 120); } return o; }
    case "toifalar": return arr(v).filter(t => t && t.nom && GURUH[t.guruh]).map(t => { const o = {nom: String(t.nom).slice(0, 80), guruh: t.guruh}; if(t.icon && /^[a-z0-9-]{2,30}$/.test(t.icon)) o.icon = t.icon; return o; }).slice(0, 200);
    case "jamgarma": return arr(v).filter(j => j && j.nom && GURUH[j.guruh] && +j.soat > 0).map(j => ({id: String(j.id || uid()), nom: String(j.nom).slice(0, 80), guruh: j.guruh, soat: Math.round(+j.soat)})).slice(0, 50);
    case "yopiqOylar": return arr(v).filter(x => /^\d{4}-\d{2}$/.test(x));
    case "nishonBer": return arr(v).filter(x => typeof x === "string").slice(0, 50);
  }
  return v;
}
function tozaReja(o){ const out = {}; if(o && typeof o === "object") for(const g of GURUH_TARTIB){ const n = Math.round(+o[g]); if(n > 0 && n <= KUNLIK) out[g] = n; } return out; }

// ---- Yuklash / saqlash ----
function storeLoad(){
  const raw = jparse(lsGet(KEY), null);
  S.yozuvlar = Array.isArray(raw) ? raw.map(tozaYozuv).filter(Boolean) : [];
  const o = jparse(lsGet(CFG_KEY), null);
  if(o && typeof o === "object"){
    for(const name of CFG_DOCS) if(o[name] !== undefined) S[name] = tozaCfg(name, o[name]);
    if(o.rejaKun && typeof o.rejaKun === "object"){ S.rejaKun = {}; for(const d in o.rejaKun){ if(isIso(d)){ const r = tozaReja(o.rejaKun[d]); if(Object.keys(r).length) S.rejaKun[d] = r; } } }
    if(o.kayfiyat && typeof o.kayfiyat === "object"){ S.kayfiyat = {}; for(const d in o.kayfiyat){ const v = +o.kayfiyat[d]; if(isIso(d) && v >= 1 && v <= 5) S.kayfiyat[d] = v; } }
  }
  metaLoad();
  invalidateIdx();
}
let _quotaAytildi = false;
// Ma'lumot va yuborish navbati doim birga yoziladi: ilova shu zahoti yopilsa ham, yozuv «yuborilmagan» bo'lib qoladi va keyin ketadi
function saqlaY(){
  invalidateIdx();
  const matn = JSON.stringify(S.yozuvlar);
  let ok = lsSet(KEY, matn);
  if(!ok && bkBoshat()) ok = lsSet(KEY, matn);                  // joy yetmasa — eski avto zaxiralar o'chirilib, qayta yoziladi
  if(!ok && !_quotaAytildi && !VB_KORGAZMA){ _quotaAytildi = true; setTimeout(() => toast(`${ic("triangle-alert")}<span>Qurilma xotirasi to'ldi — yangi yozuvlar saqlanmayapti. Profil → Zaxira va ma'lumotlar'dan zaxira oling.</span>`, {ms: 8000}), 50); }
  if(Meta.uid) metaSave();
}
function saqlaC(){
  lsSet(CFG_KEY, JSON.stringify({byudjet: S.byudjet, shablonlar: S.shablonlar, sozlama: S.sozlama, timer: S.timer, toifalar: S.toifalar,
    rejaKun: S.rejaKun, jamgarma: S.jamgarma, kayfiyat: S.kayfiyat, yopiqOylar: S.yopiqOylar, nishonBer: S.nishonBer}));
  if(Meta.uid) metaSave();
}
// Boshqa oyna (tab) xotirani o'zgartirganda: holat qayta o'qiladi, lekin shu oynaning hali yuborilmagan
// o'zgarishlari (navbatdagilari) yo'qolmaydi — ular qayta o'qilgan holat ustiga qo'yiladi va qaytadan saqlanadi.
function storeQaytaYukla(){
  const eski = {y: S.yozuvlar, out: Meta.out, uid: Meta.uid, cfg: {}, reja: S.rejaKun, kayf: S.kayfiyat};
  for(const n of CFG_DOCS) eski.cfg[n] = S[n];
  storeLoad();
  if(!eski.uid || eski.uid !== Meta.uid) return false;            // hisob almashgan yoki hisobsiz rejim — birlashtirilmaydi
  let ozgardi = false, ix = null;
  for(const k in eski.out){
    const m = eski.out[k], b = Meta.out[k];
    if(b && b.t >= m.t) continue;                                 // xotirada shu yoki undan yangi niyat allaqachon bor
    const tur = k.charAt(0), id = k.slice(2);
    if(tur === "y"){
      if(!ix){ ix = new Map(); S.yozuvlar.forEach((r, i) => ix.set(r.id, i)); }
      const i = ix.has(id) ? ix.get(id) : -1;
      if(m.d){ if(i >= 0) S.yozuvlar[i] = null; }
      else { const r = eski.y.find(x => x.id === id); if(!r) continue; if(i >= 0) S.yozuvlar[i] = r; else { S.yozuvlar.push(r); ix.set(id, S.yozuvlar.length - 1); } }
    }
    else if(tur === "c"){ if(!CFG_DOCS.includes(id)) continue; S[id] = eski.cfg[id]; }
    else if(tur === "r"){ if(m.d || !eski.reja[id]) delete S.rejaKun[id]; else S.rejaKun[id] = eski.reja[id]; }
    else if(tur === "k"){ if(m.d || !eski.kayf[id]) delete S.kayfiyat[id]; else S.kayfiyat[id] = eski.kayf[id]; }
    else continue;
    Meta.out[k] = m; ozgardi = true;
  }
  if(ix) S.yozuvlar = S.yozuvlar.filter(Boolean);
  if(ozgardi){ saqlaY(); saqlaC(); }
  return ozgardi;
}
function storeReset(){
  S.yozuvlar = []; S.byudjet = {...VBUDJET}; S.shablonlar = SHABLON_STD.map(x => ({...x})); S.sozlama = {...SOZLAMA_STD}; S.timer = {...TIMER_STD};
  S.toifalar = []; S.rejaKun = {}; S.jamgarma = []; S.kayfiyat = {}; S.yopiqOylar = []; S.nishonBer = [];
  invalidateIdx();
}

// ---- Indeks: kunlar bir marta guruhlanadi (O(N)), qidiruv O(1) ----
let _idx = null;
function reindex(){
  const byDay = Object.create(null), chiq = Object.create(null), kirim = Object.create(null), all = [];
  for(let i = 0; i < S.yozuvlar.length; i++){
    const r = S.yozuvlar[i], s = r.sana;
    if(r.tur === "kirim"){ if(!kirim[s]) kirim[s] = r; continue; }
    (byDay[s] || (byDay[s] = [])).push(r);
    chiq[s] = (chiq[s] || 0) + r.daqiqa;
    all.push(r);
  }
  _idx = {byDay, chiq, kirim, all, days: Object.keys(byDay).sort()};
  return _idx;
}
function idx(){ return _idx || reindex(); }
function invalidateIdx(){ _idx = null; }
function kunlar(){ return idx().days; }                       // yozuvi bor kunlar (o'sish tartibida)
function chiqimlar(){ return idx().all; }                     // barcha sarf yozuvlari
function kunYozuv(s){ return idx().byDay[s] || []; }
function kunChiqim(s){ return idx().chiq[s] || 0; }
function toliqKunmi(s){ return (idx().chiq[s] || 0) >= 1380; }
function yozuvTop(id){ return S.yozuvlar.find(x => x.id === id) || null; }

// ---- Toifalar ----
function katGuruh(kat){
  const k = String(kat).trim();
  const c = S.toifalar.find(t => t.nom === k);
  if(c && GURUH[c.guruh]) return c.guruh;
  const m = k.match(/^(\d{2})/);
  if(m && RAQAM_GURUH[m[1]]) return RAQAM_GURUH[m[1]];
  return "yol";
}
function katIcon(kat){
  const k = String(kat).trim();
  const c = S.toifalar.find(t => t.nom === k);
  if(c && c.icon) return c.icon;
  if(!c){ const m = k.match(/^(\d{2})/); if(m && RAQAM_ICON[m[1]]) return RAQAM_ICON[m[1]]; }
  return GURUH[katGuruh(k)].icon;
}
function yashirinlar(){ return S.sozlama.yashirin || []; }
function barchaKategoriyalar(){ return KATEGORIYALAR.concat(S.toifalar.map(t => t.nom)); }
function faolKategoriyalar(){ const y = yashirinlar(); return barchaKategoriyalar().filter(k => !y.includes(k)); }

// ---- Namuna ma'lumot belgisi (yozuvlar misol uchun yuklangan bo'lsa) ----
let _namuna = null;
function namunami(){ if(_namuna === null) _namuna = lsGet("vbDemo") === "1"; return _namuna; }
function namunaBelgi(ha){ _namuna = !!ha; if(ha) lsSet("vbDemo", "1"); else lsDel("vbDemo"); }

// ---- Oy yopish ----
function isYopiq(sana){ return S.yopiqOylar.includes(oyKey(sana)); }
function guardYopiq(sana){ if(isYopiq(sana)){ toast(`${ic("lock")}<span>${oyNomi(oyKey(sana))} yopilgan — o'zgartirish uchun Profil → Ma'lumotlar bo'limidan oching</span>`); return true; } return false; }

// ---- Yozuvlar bilan amallar ----
function entryAdd(list){
  const ids = []; let blok = 0;
  for(const e of list){
    const d = Math.round(+e.daqiqa);
    if(!isIso(e.sana) || !e.kat || !(d > 0)) continue;
    if(isYopiq(e.sana)){ blok++; continue; }
    const rec = {id: uid(), sana: e.sana, tur: "chiqim", kat: String(e.kat), daqiqa: Math.min(d, KUNLIK), izoh: String(e.izoh || "").trim().slice(0, 500), u: nowTs()};
    if(e.vaqt && hmToMin(e.vaqt) != null) rec.vaqt = e.vaqt;
    S.yozuvlar.push(rec); ids.push(rec.id); markOut("y:" + rec.id);
  }
  if(ids.length){ saqlaY(); Bus.emit("local", "yozuv"); }
  return {ids, blok};
}
function entryUpdate(id, patch){
  const r = yozuvTop(id); if(!r) return false;
  if(isYopiq(r.sana) || (patch.sana && isYopiq(patch.sana))) return false;
  if(patch.sana && isIso(patch.sana)) r.sana = patch.sana;
  if(patch.kat) r.kat = String(patch.kat);
  if(+patch.daqiqa > 0) r.daqiqa = Math.min(Math.round(+patch.daqiqa), KUNLIK);
  if(patch.izoh !== undefined) r.izoh = String(patch.izoh || "").trim().slice(0, 500);
  if(patch.vaqt !== undefined){ if(patch.vaqt && hmToMin(patch.vaqt) != null) r.vaqt = patch.vaqt; else delete r.vaqt; }
  r.u = nowTs();
  markOut("y:" + r.id); saqlaY(); Bus.emit("local", "yozuv");
  return true;
}
function entryRemove(ids){
  const set = new Set(ids), out = [];
  S.yozuvlar = S.yozuvlar.filter(r => { if(set.has(r.id)){ out.push(r); markOut("y:" + r.id, true); return false; } return true; });
  if(out.length){ saqlaY(); Bus.emit("local", "yozuv"); }
  return out;
}
function entryRestore(recs){
  for(const r of recs){ if(yozuvTop(r.id)) continue; r.u = nowTs(); S.yozuvlar.push(r); markOut("y:" + r.id); }
  saqlaY(); Bus.emit("local", "yozuv");
}
// Barcha yozuvlarni yangisiga almashtirish (import / tozalash): farqini hisoblab, navbatga qo'yadi
function entriesReplace(arr){
  const eski = new Map(S.yozuvlar.map(r => [r.id, r]));
  const yangi = arr.map(tozaYozuv).filter(Boolean);
  const idlar = new Set();
  for(const r of yangi){ if(idlar.has(r.id)) r.id = uid(); idlar.add(r.id); r.u = nowTs(); markOut("y:" + r.id); }
  for(const id of eski.keys()) if(!idlar.has(id)) markOut("y:" + id, true);
  S.yozuvlar = yangi; saqlaY(); Bus.emit("local", "yozuv");
}

// ---- Sozlamalar bilan amallar ----
function cfgTouch(name, jim){ markOut("c:" + name); saqlaC(); if(!jim) Bus.emit("local", name); }
function rejaKunSet(sana, obj){
  const o = tozaReja(obj);
  if(Object.keys(o).length){ S.rejaKun[sana] = o; markOut("r:" + sana); } else { delete S.rejaKun[sana]; markOut("r:" + sana, true); }

}
function kayfiyatSet(sana, v){
  if(v >= 1 && v <= 5 && S.kayfiyat[sana] !== v){ S.kayfiyat[sana] = v; markOut("k:" + sana); } else { delete S.kayfiyat[sana]; markOut("k:" + sana, true); }
  saqlaC(); Bus.emit("local", "kayfiyat");
}

// ---- Oylik avto zaxira (shu qurilmada) ----
// Brauzer xotirasi cheklangan (taxminan 5 MB), shuning uchun zaxiralar soni ma'lumot hajmiga qarab kamayadi:
// kichik daftar — oxirgi 3 oy, katta — 1 oy, juda katta — saqlanmaydi (bulut va JSON eksport qoladi).
function bkPrefix(){ return "vbBk:" + (Meta.uid ? Meta.uid.slice(0, 8) + ":" : ""); }
function bkNechta(){ const h = (lsGet(KEY) || "").length; return h > 2400000 ? 0 : h > 1100000 ? 1 : 3; }
function bkSnap(){
  try{
    if(!S.yozuvlar.length) return;
    const p = bkPrefix(), k = p + oyKey(bugunISO()), nechta = bkNechta();
    let ks = bkKalitlar(p);
    if(nechta && !lsGet(k)){
      while(ks.length >= nechta) lsDel(ks.shift());             // avval joy bo'shatiladi
      lsSet(k, JSON.stringify(toliqZaxira()));
      ks = bkKalitlar(p);
    }
    while(ks.length > nechta) lsDel(ks.shift());
  }catch(e){}
}
// Joy bo'shatish: barcha avto zaxiralar o'chiriladi. Biror narsa o'chgan bo'lsa true.
function bkBoshat(){
  try{ const ks = Object.keys(localStorage).filter(x => x.indexOf("vbBk:") === 0); ks.forEach(lsDel); return ks.length > 0; }catch(e){ return false; }
}
// Faqat shu hisobning zaxiralari (prefiksdan keyin aynan YYYY-MM turadi)
function bkKalitlar(p){ return Object.keys(localStorage).filter(x => x.indexOf(p) === 0 && /^\d{4}-\d{2}$/.test(x.slice(p.length))).sort(); }
function bkList(){ try{ return bkKalitlar(bkPrefix()).reverse(); }catch(e){ return []; } }
function toliqZaxira(){
  return {ilova: "vaqt-banki", versiya: 2, sana: new Date().toISOString(), yozuvlar: S.yozuvlar,
    byudjet: S.byudjet, shablonlar: S.shablonlar, sozlama: S.sozlama, toifalar: S.toifalar, rejaKun: S.rejaKun,
    jamgarma: S.jamgarma, kayfiyat: S.kayfiyat, yopiqOylar: S.yopiqOylar, nishonBer: S.nishonBer};
}


// ============================ 4. HISOB ============================
function guruhJami(rows){
  const o = {}; for(const g of GURUH_TARTIB) o[g] = 0;
  for(const r of rows){ if(r.tur !== "kirim") o[katGuruh(r.kat)] += r.daqiqa; }
  return o;
}
// Bir kunning yo'nalishlar bo'yicha jami (indeksda keshlanadi)
function kunGuruh(s){
  const ix = idx(); if(!ix.gj) ix.gj = Object.create(null);
  return ix.gj[s] || (ix.gj[s] = guruhJami(ix.byDay[s] || []));
}
function bucketJami(gj){
  let foydali = 0, zarur = 0, behuda = 0;
  for(const g of GURUH_TARTIB){ const b = GURUH[g].bucket; if(b === "foydali") foydali += gj[g]; else if(b === "behuda") behuda += gj[g]; else zarur += gj[g]; }
  return {foydali, zarur, behuda};
}
// Davr: "7" | "30" | "yil" | "hammasi" -> shu davrdagi yozilgan kunlar
function davrKunlar(davr){
  const all = kunlar(), t = bugunISO();
  if(davr === "7" || davr === "30"){ const from = addDays(t, -(+davr - 1)); return all.filter(d => d >= from && d <= t); }
  if(davr === "yil"){ const y = t.slice(0, 4); return all.filter(d => d.slice(0, 4) === y); }
  return all.slice();
}
function davrNomi(davr){ return davr === "7" ? "oxirgi 7 kun" : davr === "30" ? "oxirgi 30 kun" : davr === "yil" ? new Date().getFullYear() + "-yil" : "butun davr"; }
// Kunlar to'plami bo'yicha umumiy ko'rsatkichlar
function statHisob(days){
  const full = days.filter(toliqKunmi);
  const g = {}, gf = {}; for(const x of GURUH_TARTIB){ g[x] = 0; gf[x] = 0; }
  let jami = 0;
  for(const d of days){ const gj = kunGuruh(d); for(const x of GURUH_TARTIB) g[x] += gj[x]; jami += kunChiqim(d); }
  for(const d of full){ const gj = kunGuruh(d); for(const x of GURUH_TARTIB) gf[x] += gj[x]; }
  const b = bucketJami(g);
  return {days, full, g, gf, jami, foydali: b.foydali, zarur: b.zarur, behuda: b.behuda,
    ort: x => full.length ? gf[x] / full.length : 0};
}
function guruhOrtacha(g){ const dd = kunlar().filter(toliqKunmi); if(!dd.length) return 0; let s = 0; for(const d of dd) s += kunGuruh(d)[g]; return s / dd.length; }
function uyquQarz(){ let q = 0; for(const d of kunlar()) if(toliqKunmi(d)) q += (S.byudjet.uyqu - kunGuruh(d).uyqu); return q; }
function ishOrtiq(){ let q = 0; for(const d of kunlar()) if(toliqKunmi(d)) q += (kunGuruh(d).ish - S.byudjet.ish); return q; }
// Behuda limitidan oshgan vaqt "qarz" bo'lib yig'iladi, tejalgan kunlar hisobiga to'lanadi
function tangaQarz(){
  const lim = S.byudjet.behuda || 0; let bal = 0, yigildi = 0, tolandi = 0;
  for(const d of kunlar()){ if(!toliqKunmi(d)) continue;
    const b = kunGuruh(d).behuda || 0;
    if(b > lim){ bal += b - lim; yigildi += b - lim; }
    else { const t = Math.min(bal, lim - b); bal -= t; tolandi += t; }
  }
  return {lim, bal, yigildi, tolandi};
}

function isoHafta(iso){
  const t = dOf(iso); t.setHours(0, 0, 0, 0);
  t.setDate(t.getDate() + 3 - ((t.getDay() + 6) % 7));
  const w1 = new Date(t.getFullYear(), 0, 4);
  const week = 1 + Math.round(((t - w1) / 86400000 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  return t.getFullYear() + "-H" + String(week).padStart(2, "0");
}
function pearson(xs, ys){
  const n = xs.length; if(n < 3) return null;
  const mx = xs.reduce((a, b) => a + b, 0) / n, my = ys.reduce((a, b) => a + b, 0) / n;
  let sxy = 0, sx = 0, sy = 0;
  for(let k = 0; k < n; k++){ const a = xs[k] - mx, b = ys[k] - my; sxy += a * b; sx += a * a; sy += b * b; }
  if(sx === 0 || sy === 0) return null; return sxy / Math.sqrt(sx * sy);
}

// ---- Maqsadlar va ketma-ketlik ----
function maqsadlar(){
  const b = S.byudjet, behLim = b.behuda || 30;
  return [
    {key:"uyqu", icon:"moon",      g:"uyqu",   nom:`Uyqu kamida ${soat(b.uyqu)}`,          ok:d => kunGuruh(d).uyqu >= b.uyqu},
    {key:"ish",  icon:"briefcase", g:"ish",    nom:`Ish ${soat(b.ish)} dan oshmasin`,      ok:d => kunGuruh(d).ish <= b.ish},
    {key:"beh",  icon:"hourglass", g:"behuda", nom:`Behuda ${behLim} tangadan oshmasin`,   ok:d => kunGuruh(d).behuda <= behLim},
    {key:"riv",  icon:"sprout",    g:"rivoj",  nom:`Rivojlanish kamida ${soat(b.rivoj)}`,  ok:d => kunGuruh(d).rivoj >= b.rivoj},
  ];
}
function streak(okFn){
  const dd = kunlar().filter(toliqKunmi);
  let best = 0, run = 0;
  for(const d of dd){ if(okFn(d)){ run++; if(run > best) best = run; } else run = 0; }
  let cur = 0;
  for(let k = dd.length - 1; k >= 0; k--){ if(okFn(dd[k])) cur++; else break; }
  return {cur, best, total: dd.length};
}
// To'liq kunlarning eng uzun uzluksiz zanjiri (kunma-kun)
function fullStreakEng(dd){
  let best = 0, cur = 0, prev = null;
  for(const d of dd){ if(prev && addDays(prev, 1) === d) cur++; else cur = 1; if(cur > best) best = cur; prev = d; }
  return best;
}
// Bugungacha davom etayotgan to'liq kunlar zanjiri
function joriyZanjir(){
  const t = bugunISO(); let d = toliqKunmi(t) ? t : addDays(t, -1), n = 0;
  while(toliqKunmi(d)){ n++; d = addDays(d, -1); }
  return n;
}

  {id:"sarrof",   icon:"medal",        nom:"Sarrof",       t:"7 to'liq kun",     f:s => s.full >= 7},

];
function nishonStat(){
  const dd = kunlar(), fullD = dd.filter(toliqKunmi), lim = S.byudjet.behuda || 0;
  let b7 = 0, beh7 = false;
  for(const d of fullD){ if((kunGuruh(d).behuda || 0) <= lim){ b7++; if(b7 >= 7){ beh7 = true; break; } } else b7 = 0; }
  return {days: dd.length, full: fullD.length, streak: fullStreakEng(fullD), behuda7: beh7};
}

// ---- Vaqt jamg'armasi (yillik maqsadlar) ----
function yilGuruhSum(g, yil){ let s = 0; const y = String(yil); for(const d of kunlar()) if(d.slice(0, 4) === y) s += kunGuruh(d)[g]; return s; }
function jamgarmaHolat(j){
  const yil = new Date().getFullYear();
  const kunO = Math.max(1, Math.ceil((Date.now() - new Date(yil, 0, 1)) / 86400000));
  const qoldKun = Math.max(1, Math.ceil((new Date(yil, 11, 31) - Date.now()) / 86400000));
  const done = yilGuruhSum(j.guruh, yil) / 60;
  const pct = Math.min(done / j.soat * 100, 100);
  const sur = done / kunO, kerak = Math.max(0, j.soat - done);
  const haft = (kerak / qoldKun * 7).toFixed(1);
  const prog = sur > 0 ? new Date(Date.now() + kerak / sur * 86400000) : null;
  const matn = kerak <= 0 ? "Maqsadga yetdingiz"
    : (prog && prog.getFullYear() === yil ? `shu sur'atda ${prog.getDate()}-${OYLAR[prog.getMonth()]}da yetasiz` : `haftasiga ${haft} soat kerak`);
  return {done, pct, kerak, matn, tugadi: kerak <= 0};
}

// ---- Hafta kunlari bo'yicha naqsh ----
function haftaKunStat(days){
  const map = {};
  for(const d of days){ if(!toliqKunmi(d)) continue;
    const wd = (dOf(d).getDay() + 6) % 7, g = kunGuruh(d);
    if(!map[wd]) map[wd] = {n: 0, uyqu: 0, ish: 0, behuda: 0};
    map[wd].n++; map[wd].uyqu += g.uyqu; map[wd].ish += g.ish; map[wd].behuda += g.behuda;
  }
  return map;
}

// ---- #Teglar ----
function tegStat(days){
  const set = new Set(days), map = {};
  for(const r of chiqimlar()){ if(!r.izoh || !set.has(r.sana)) continue;
    const mm = r.izoh.match(/#[\p{L}\d_]+/gu); if(!mm) continue;
    for(const t of mm){ const k = t.toLowerCase(); (map[k] = map[k] || {min: 0, n: 0}); map[k].min += r.daqiqa; map[k].n++; } }
  return Object.entries(map).sort((a, b) => b[1].min - a[1].min).slice(0, 10);
}

// ---- Aqlli tavsiyalar ----
function tavsiyalar(days){
  const out = [], st = statHisob(days), som = S.sozlama.som || 0;
  const u = st.ort("uyqu"), i = st.ort("ish"), behuda = st.behuda;
  if(u > 0){
    if(u < 420) out.push({cl:"warn", icon:"bed", h:"Uyqu me'yordan kam",
      p:`Kuniga o'rtacha <b>${soat(u)}</b> uxlayapsiz. Sog'lik uchun <b>7–8 soat</b> tavsiya etiladi — kuniga yana <b class="num">${tanga(450 - u)}</b> tangani uyquga ajratsangiz, kunduzgi unumdorlik sezilarli oshadi.`});
    else if(u > 540) out.push({cl:"info", icon:"bed-double", h:"Uyqu yetarli, hatto ko'proq",
      p:`O'rtacha <b>${soat(u)}</b> — bu yaxshi. Charchoq sezsangiz, sifat muhim: yotish vaqtini barqaror tuting.`});
    else out.push({cl:"ok", icon:"moon", h:"Uyqu muvozanatda", p:`O'rtacha <b>${soat(u)}</b> — sog'lom oraliqda. Shu ritmni saqlang.`});
  }
  if(i > 720) out.push({cl:"bad", icon:"flame", h:"Ish yuki juda yuqori",
    p:`Kuniga o'rtacha <b>${soat(i)}</b> ishlayapsiz. Bu sur'at uzoq muddatda charchatadi. Kuniga hech bo'lmasa <b>30–60 daqiqa</b>ni dam va sog'liqqa ajrating.`});
  else if(i > 600) out.push({cl:"warn", icon:"briefcase", h:"Ish ulushi katta",
    p:`O'rtacha <b>${soat(i)}</b> ish. Maqsadli bo'lsa yaxshi, ammo tanaffuslarni rejalashtiring.`});
  if(behuda > 0){
    const kunlik = behuda / Math.max(1, days.length);
    const pul = som > 0 ? ` Pul hisobida bu <b class="num">${somF(behuda * som)}</b>.` : "";
    out.push({cl:"bad", icon:"hourglass", h:`${tanga(behuda)} tanga behuda ketdi`,
      p:`Jami <b>${soat(behuda)}</b> behuda o'tgan.${pul} Buni <b>yarmiga</b> qisqartirsangiz, oyiga taxminan <b class="num">${soat(kunlik / 2 * 30)}</b> qaytarib olasiz.`});
  } else if(days.length){
    out.push({cl:"ok", icon:"target", h:"Behuda vaqt nazoratda", p:`Bu davrda behuda yo'qotish yo'q. Bu kuchli intizom belgisi.`});
  }
  const eng = GURUH_TARTIB.filter(g => g !== "ish" && g !== "uyqu").sort((a, b) => st.g[b] - st.g[a])[0];
  if(st.g[eng] > 0) out.push({cl:"info", icon:"chart-pie", h:"Ish va uyqudan keyingi eng katta sarf",
    p:`Ish va uyqu hisobga olinmasa, eng ko'p vaqt <b>«${GURUH[eng].nom}»</b> yo'nalishiga ketadi — jami <b class="num">${soat(st.g[eng])}</b>. Shu yo'nalishni tartibga solsangiz, eng ko'p tanga bo'shaydi.`});
  { // eng qimmat odat (izohlar bo'yicha)
    const set = new Set(days), hab = {};
    for(const r of chiqimlar()){ if(!r.izoh || !set.has(r.sana)) continue;
      const k = r.izoh.trim().toLowerCase(); if(k.length < 3) continue;
      (hab[k] = hab[k] || {min: 0, n: 0}); hab[k].min += r.daqiqa; hab[k].n++; }
    const top = Object.entries(hab).filter(x => x[1].n >= 3).sort((a, b) => b[1].min - a[1].min)[0];
    if(top) out.push({cl:"warn", icon:"repeat", h:"Eng qimmat odat",
      p:`«${esc(top[0])}» — ${top[1].n} marta takrorlangan, jami <b class="num">${soat(top[1].min)}</b>${som > 0 ? ` (${somF(top[1].min * som)})` : ""}. Shu bitta odatni boshqarsangiz, eng katta tejov shu yerda.`});
  }
  { // kayfiyat bog'liqligi
    const md = days.filter(d => S.kayfiyat[d] && toliqKunmi(d));
    if(md.length >= 7){
      const moods = md.map(d => S.kayfiyat[d]);
      const cu = pearson(moods, md.map(d => kunGuruh(d).uyqu / 60)), cb = pearson(moods, md.map(d => kunGuruh(d).behuda / 60));
      if(cu !== null && Math.abs(cu) >= 0.4) out.push({cl: cu > 0 ? "ok" : "warn", icon:"smile", h:"Uyqu va kayfiyat",
        p:`Kayfiyat baholaringiz uyqu bilan ${cu > 0 ? "ijobiy" : "salbiy"} bog'langan (r = ${cu.toFixed(2)}). ${cu > 0 ? "Yaxshi uxlagan kunlaringizda kayfiyat sezilarli baland." : ""}`});
      if(cb !== null && cb <= -0.4) out.push({cl:"warn", icon:"smartphone", h:"Behuda vaqt kayfiyatni tushiradi",
        p:`Behuda vaqt ko'p bo'lgan kunlarda kayfiyatingiz pastroq (r = ${cb.toFixed(2)}). Telefonni cheklash — kayfiyatga sarmoya.`});
    }
  }
  if(st.full.length >= 1) out.push({cl:"info", icon:"clipboard-check", h:"Hisob aniqligi",
    p:`<b>${st.full.length}</b> kun to'liq (1440 tanga) yozilgan. Qancha ko'p kun yozsangiz, tavsiyalar shuncha aniq bo'ladi.`});
  return out;
}

// ---- Haftalik hisobot: oxirgi 7 kun (A) va undan oldingi 7 kun (B) ----
function haftaHisob(){
  const t = bugunISO();
  const rng = off => { const a = []; for(let k = 6; k >= 0; k--) a.push(addDays(t, -k - off)); return a; };
  const sum = days => { const o = {days, ch: 0, full: 0, n: 0, g: {}}; GURUH_TARTIB.forEach(g => o.g[g] = 0);
    for(const d of days){ const sp = kunChiqim(d); o.ch += sp; if(sp > 0) o.n++; if(toliqKunmi(d)) o.full++; const gj = kunGuruh(d); GURUH_TARTIB.forEach(g => o.g[g] += gj[g]); }
    return o; };
  const A = sum(rng(0)), B = sum(rng(7));
  return {A, B, eng: GURUH_TARTIB.slice().sort((a, b) => A.g[b] - A.g[a])[0]};
}
// Matn ko'rinishi (nusxalash va AI uchun)
function haftaText(){
  const {A, B, eng} = haftaHisob();
  const df = (a, b) => { const d = Math.round((a - b) / 60 * 10) / 10; return d === 0 ? "o'zgarishsiz" : (d > 0 ? `+${d}s` : `${d}s`); };
  let s = `HAFTALIK HISOBOT (${sanaQisqa(A.days[0])} – ${sanaQisqa(A.days[6])})\n`;
  s += `Yozilgan: ${soat(A.ch)} · ${A.full} to'liq kun · o'tgan haftaga nisbatan ${df(A.ch, B.ch)}\n`;
  s += `Eng katta yo'nalish: ${GURUH[eng].nom} — ${soat(A.g[eng])}\n`;
  s += `Uyqu: ${soat(A.g.uyqu)} (${df(A.g.uyqu, B.g.uyqu)}) · Ish: ${soat(A.g.ish)} (${df(A.g.ish, B.g.ish)})\n`;
  s += `Rivojlanish: ${soat(A.g.rivoj)} (${df(A.g.rivoj, B.g.rivoj)}) · Behuda: ${soat(A.g.behuda)} (${df(A.g.behuda, B.g.behuda)})`;
  if(S.sozlama.som > 0 && A.g.behuda > 0) s += ` ≈ ${somF(A.g.behuda * S.sozlama.som)}`;
  return s;
}

// ---- Yil xulosasi ----
function wrapStats(yil){
  const dd = kunlar().filter(d => d.slice(0, 4) === String(yil)), full = dd.filter(toliqKunmi);
  let ch = 0; const g = {}; GURUH_TARTIB.forEach(x => g[x] = 0); const oy = {};
  for(const d of dd){ ch += kunChiqim(d); const gj = kunGuruh(d); GURUH_TARTIB.forEach(x => g[x] += gj[x]); const m = +d.slice(5, 7); oy[m] = (oy[m] || 0) + gj.ish + gj.rivoj; }
  const topG = dd.length ? GURUH_TARTIB.slice().sort((a, b) => g[b] - g[a])[0] : null;
  const bestOy = Object.entries(oy).sort((a, b) => b[1] - a[1])[0];
  return {dd, full, ch, g, topG, bestOy, streak: fullStreakEng(full)};
}

// ---- Asosiy ekran uchun: bitta eng muhim kuzatuv ----
function bugunKuzatuv(){
  const t = tanlangan || bugunISO(), gj = kunGuruh(t), b = S.byudjet, spent = kunChiqim(t);
  if(!kunlar().length) return {icon:"lightbulb", cl:"info", h:"Bir kun — 1440 tanga", p:"Har bir daqiqa bitta tanga. Kun davomida nimaga sarflaganingizni yozib boring — kechqurun kuningiz qayerga ketgani ko'rinadi."};
  if(gj.behuda > Math.max(b.behuda, 30)) return {icon:"hourglass", cl:"bad", h:"Behuda vaqt limitdan oshdi", p:`Bu kunda <b>${soat(gj.behuda)}</b> behuda ketgan — limit ${b.behuda || 30} tanga.${S.sozlama.som > 0 ? ` Bu <b>${somF(gj.behuda * S.sozlama.som)}</b>ga teng.` : ""}`};
  if(spent >= 1380 && gj.uyqu < b.uyqu - 30) return {icon:"bed", cl:"warn", h:"Uyqu rejadan kam", p:`Bu kunda <b>${soat(gj.uyqu)}</b> uxlagansiz — reja ${soat(b.uyqu)}. Yetishmagan uyqu qarz bo'lib yig'iladi.`};
  if(spent >= 1380) return {icon:"circle-check", cl:"ok", h:"Kun to'liq hisobga olindi", p:`1440 tangadan <b>${tanga(spent)}</b> tasi yozilgan. Foydali vaqt ulushi — <b>${foiz(bucketJami(gj).foydali, spent)}%</b>.`};
  const z = joriyZanjir();
  if(z >= 2) return {icon:"flame", cl:"warn", h:`${z} kun ketma-ket to'liq`, p:"Zanjir uzilmasin — bugungi kunni ham 1440 tangagacha yozib chiqing."};
  const q = uyquQarz();
  if(q > 120) return {icon:"bed", cl:"warn", h:"Uyqu qarzi yig'ilgan", p:`To'liq kunlar bo'yicha <b>${soat(q)}</b> uyqu yetishmagan. Reja bo'limida batafsil ko'rasiz.`};
  return {icon:"lightbulb", cl:"info", h:"Kunni oxirigacha yozing", p:"Kun 1380 tangadan oshsa «to'liq» hisoblanadi — o'rtachalar, zanjir va tavsiyalar faqat to'liq kunlar bo'yicha chiqadi."};
}


// ============================ 5. SINXRON (server bilan aloqa) ============================
// Ishlash tartibi: har bir yozuv va sozlama alohida "element". Lokal o'zgarish navbatga (Meta.out) tushadi,
// serverga yuboriladi; server har o'zgarishga tartib raqami (rev) beradi. Boshqa qurilma o'zgartirsa,
// WebSocket orqali darhol xabar keladi va faqat yangi elementlar olinadi. Internet bo'lmasa — navbat kutadi.
const Sync = {
  token: null, user: null, devId: null,
  tabId: uid(),        // shu oynaning (tab) belgisi: bitta qurilmada bir nechta oyna ochiq bo'lsa, bir-birini yangilab turadi
  holat: "local",      // local | ulanmoqda | sinxron | jonli | onlayn | oflayn | xato | chiqdi
  xato: "", oxirgi: 0, onlayn: 0,
  ws: null, wsOk: false, band: false, yana: false,
};
class ApiXato extends Error { constructor(status, kod, msg){ super(msg); this.status = status; this.kod = kod; } }

function apiBase(){
  const v = (lsGet("vbApi") || VB_SERVER || "").trim();
  if(v) return v.replace(/\/+$/, "");
  return /^https?:$/.test(location.protocol) ? location.origin : "";
}
async function api(method, path, body, opt){
  opt = opt || {};
  const base = apiBase();
  if(!base) throw new ApiXato(0, "server_yoq", "Server manzili kiritilmagan");
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), opt.timeout || 25000);
  const headers = {};
  if(body !== undefined) headers["Content-Type"] = "application/json";
  if(!opt.noAuth && Sync.token) headers.Authorization = "Bearer " + Sync.token;
  let res;
  try{
    res = await fetch(base + path, {method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, signal: ctl.signal, keepalive: !!opt.keepalive});
  }catch(e){
    throw new ApiXato(0, e && e.name === "AbortError" ? "vaqt" : "tarmoq", e && e.name === "AbortError" ? "Server javob bermadi — birozdan keyin urinib ko'ring" : "Internet yoki server bilan aloqa yo'q");
  }finally{ clearTimeout(tm); }
  let data = null;
  if((res.headers.get("content-type") || "").includes("application/json")){ try{ data = await res.json(); }catch(e){} }
  if(!res.ok){
    if(res.status === 401 && data && data.error === "sessiya_yoq" && !opt.noAuth && Sync.token) sessiyaTugadi();
    // 502/503/504 va javob bizniki emas — server hali uyg'onmagan (Render bepul tarifda uxlab qoladi)
    if(!data && (res.status === 502 || res.status === 503 || res.status === 504)) throw new ApiXato(res.status, "uygonmoqda", "Server uyg'onmoqda — bir daqiqagacha kuting");
    throw new ApiXato(res.status, (data && data.error) || "xato", (data && data.message) || (res.status === 404 || res.status === 405 ? "Bu manzilda Vaqt Banki serveri topilmadi" : `Server xatosi (${res.status})`));
  }
  if(!data) throw new ApiXato(res.status, "format", "Bu manzilda Vaqt Banki serveri topilmadi");
  if(data.now) _clockOff = data.now - Date.now();
  return data;
}
// Server uyg'onayotgan bo'lsa — tayyor bo'lguncha kutib, qayta urinadi (kirish va ro'yxatdan o'tishda)
async function apiSabr(method, path, body, opt){
  for(let i = 0; ; i++){
    try{ return await api(method, path, body, opt); }
    catch(e){ if((e.kod !== "uygonmoqda" && e.kod !== "baza") || i >= 24) throw e; await new Promise(r => setTimeout(r, 4000)); }
  }
}
function qurilmaNomi(){
  const u = navigator.userAgent || "";
  const os = /Android/i.test(u) ? "Android" : /iPhone|iPad|iPod/i.test(u) ? "iPhone" : /Windows/i.test(u) ? "Windows" : /Mac OS X/i.test(u) ? "Mac" : /Linux/i.test(u) ? "Linux" : "Qurilma";
  const br = /Edg\//.test(u) ? "Edge" : /OPR\//.test(u) ? "Opera" : /SamsungBrowser/i.test(u) ? "Samsung Internet" : /Firefox\//.test(u) ? "Firefox" : /Chrome\//.test(u) ? "Chrome" : /Safari\//.test(u) ? "Safari" : "brauzer";

}

// ---- Yuborish va olish (bitta so'rovda) ----
// Navbatdagi niyatdan serverga boradigan amal yasaydi. O'chirish faqat aniq «o'chirildi» deb belgilangan bo'lsa yuboriladi:
// yozuv shunchaki topilmasa (kutilmagan holat) — hech narsa yuborilmaydi, bulutdagi nusxaga tegilmaydi.
function opYasash(key, o){
  const k = key.charAt(0), id = key.slice(2);
  if(k === "c") return CFG_DOCS.includes(id) ? {k, id, d: S[id], ts: o.t} : null;
  if(k !== "y" && k !== "r" && k !== "k") return null;
  if(o.d) return {k, id, del: 1, ts: o.t};
  const v = k === "y" ? yozuvTop(id) : k === "r" ? S.rejaKun[id] : S.kayfiyat[id];

// Bulutdan kelgan elementlarni lokal holatga qo'llash. Lokalda yangiroq (hali yuborilmagan) o'zgarish bo'lsa — tegilmaydi.
function remoteApply(items){

  let ix = null;
  if(items.length > 40){ ix = new Map(); S.yozuvlar.forEach((r, i) => ix.set(r.id, i)); }
  const topIdx = id => ix ? (ix.has(id) ? ix.get(id) : -1) : S.yozuvlar.findIndex(r => r.id === id);
  const ochir = [];
  for(const it of items){
    if(!it || !it.k) continue;
    const key = it.k + ":" + it.id, p = Meta.out[key];
    if(p && p.t >= it.ts) continue;
    if(p) delete Meta.out[key];
    if(it.k === "y"){
      const i = topIdx(it.id);
      if(it.del){ if(i >= 0){ ochir.push(it.id); n++; nima.add("yozuv"); } }
      else { const rec = tozaYozuv({...(it.d || {}), id: it.id});
        if(rec){ rec.u = it.ts; if(i >= 0) S.yozuvlar[i] = rec; else { S.yozuvlar.push(rec); if(ix) ix.set(rec.id, S.yozuvlar.length - 1); } n++; nima.add("yozuv"); } }
    } else if(it.k === "c"){
      if(CFG_DOCS.includes(it.id) && !it.del){ const kirEdi = it.id === "sozlama" && S.sozlama.alifbo === "kiril";
        S[it.id] = tozaCfg(it.id, it.d); n++; nima.add(it.id);
        if(kirEdi && S.sozlama.alifbo !== "kiril") Sync._lotinga = true; }
    } else if(it.k === "r"){
      if(isIso(it.id)){ const r = it.del ? {} : tozaReja(it.d); if(Object.keys(r).length) S.rejaKun[it.id] = r; else delete S.rejaKun[it.id]; n++; nima.add("rejaKun"); }
    } else if(it.k === "k"){
      if(isIso(it.id)){ const v = +it.d; if(it.del || !(v >= 1 && v <= 5)) delete S.kayfiyat[it.id]; else S.kayfiyat[it.id] = v; n++; nima.add("kayfiyat"); }

function lokalniQosh(lokal, items){

  const start = e => { if(e.target.closest("button")) return; on = true; y0 = e.clientY; dy = 0; t0 = Date.now(); sh.classList.add("drag"); try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){} };
  const move = e => { if(!on) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  const end = () => { if(!on) return; on = false; sh.classList.remove("drag"); sh.style.transform = "";
    if(dy > 120 || (dy > 40 && dy / Math.max(1, Date.now() - t0) > .55)) ovClose(o); };
  for(const h of [$(".grab", sh), $(".sheet-h", sh)]){ if(!h) continue;
    h.addEventListener("pointerdown", start); h.addEventListener("pointermove", move); h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end); }
}

// Vaqt tanlash (telefonning o'z soat maydoni o'rniga) -> Promise<"HH:MM" | "" (tozalandi) | null (bekor)>
// opt: {title, value, tavsiya: [{label, value}]}
function pickVaqt(opt){
  return new Promise(resolve => {
    const v0 = hmToMin(opt.value);
    let min = v0 != null ? v0 : Math.round(hozirDaqiqa() / 5) * 5 % 1440, qism = "s";
    const tav = (opt.tavsiya || []).filter(x => x && hmToMin(x.value) != null);
    const chiz = () => {
      const h = Math.floor(min / 60), m = min % 60;
      const panjara = qism === "s"
        ? Array.from({length: 24}, (_, i) => `<button type="button" class="vt-k num${i === h ? " on" : ""}" data-h="${i}">${String(i).padStart(2, "0")}</button>`).join("")
        : Array.from({length: 12}, (_, i) => i * 5).map(x => `<button type="button" class="vt-k num${x === m ? " on" : (m % 5 && Math.floor(m / 5) * 5 === x ? " yaqin" : "")}" data-m="${x}">:${String(x).padStart(2, "0")}</button>`).join("");
      return `<div class="vt-top">
          <button type="button" class="amt-b" data-st="-5" aria-label="5 daqiqa oldin">${ic("minus")}</button>
          <div class="vt-disp num"><button type="button" class="${qism === "s" ? "on" : ""}" data-q="s" aria-label="Soat">${String(h).padStart(2, "0")}</button><i>:</i><button type="button" class="${qism === "m" ? "on" : ""}" data-q="m" aria-label="Daqiqa">${String(m).padStart(2, "0")}</button></div>
          <button type="button" class="amt-b" data-st="5" aria-label="5 daqiqa keyin">${ic("plus")}</button>
        </div>
        <div class="vt-hint">${qism === "s" ? "Soatni tanlang" : "Daqiqani tanlang · ±1 uchun pastdagi tugmalar"}</div>
        <div class="vt-grid ${qism === "s" ? "s" : "m"}">${panjara}</div>
        ${qism === "m" ? `<div class="chips" style="justify-content:center;margin-top:10px"><button type="button" class="chip sm num" data-st="-1">−1 daq</button><button type="button" class="chip sm num" data-st="1">+1 daq</button></div>` : ""}
        ${tav.length ? `<div class="chips scroll vt-tav">${tav.map((x, i) => `<button type="button" class="chip sm" data-t="${i}">${ic("clock")}${esc(x.label)} <b class="num">${x.value}</b></button>`).join("")}</div>` : ""}`;
    };
    const o = openSheet({title: opt.title || "Vaqt", cls: "vt-sheet", body: `<div id="vtB">${chiz()}</div>`,
      foot: `${opt.tozalash ? `<button class="btn ghost" data-tozala style="flex:0 0 auto">Tozalash</button>` : ""}<button class="btn blue" data-ok>Tayyor</button>`,
      onClose: r => resolve(r === undefined ? null : r)});
    const yangila = () => { $("#vtB", o.el).innerHTML = chiz(); cyrPass($("#vtB", o.el)); };
    o.el.addEventListener("click", e => {
      const b = e.target.closest("button"); if(!b) return;
      if(b.dataset.h != null){ min = (+b.dataset.h) * 60 + min % 60; qism = "m"; vibra(6); yangila(); }
      else if(b.dataset.m != null){ min = Math.floor(min / 60) * 60 + (+b.dataset.m); vibra(6); yangila(); }
      else if(b.dataset.st){ min = ((min + (+b.dataset.st)) % 1440 + 1440) % 1440; vibra(4); yangila(); }
      else if(b.dataset.q){ qism = b.dataset.q; yangila(); }
      else if(b.dataset.t != null){ ovClose(o, tav[+b.dataset.t].value); }
      else if(b.dataset.ok !== undefined) ovClose(o, hhmm(min));
      else if(b.dataset.tozala !== undefined) ovClose(o, "");
    });
  });
}

function calHTML(ym, tanl){
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1, first = new Date(y, m, 1), last = new Date(y, m + 1, 0).getDate();

  for(let i = 0; i < lead; i++) h += `<span></span>`;
  for(let d = 1; d <= last; d++){

const _scroll = {};
function switchTab(t, opt){
  if(!TABLAR.includes(t)) t = "asosiy";
  const same = t === curTab;
  if(!same) _scroll[curTab] = window.scrollY;
  curTab = t;
  for(const k of TABLAR){ const el = $("#scr-" + k); if(el){ el.hidden = k !== t; el.classList.remove("enter"); } }
  const scr = $("#scr-" + t);
  $$(".nav-b").forEach(b => { const on = b.dataset.tab === t; b.classList.toggle("on", on); if(on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const lens = $("#navLens"); if(lens){ lens.style.setProperty("--i", TABLAR.indexOf(t)); if(!same && !reduceMotion){ lens.classList.remove("squish"); void lens.offsetWidth; lens.classList.add("squish"); } }
  renderNow();
  if(!same){ if(!reduceMotion){ void scr.offsetWidth; scr.classList.add("enter"); } window.scrollTo(0, (opt && opt.keep) ? (_scroll[t] || 0) : 0); }
  else if(!(opt && opt.keep)) window.scrollTo({top: 0, behavior: reduceMotion ? "auto" : "smooth"});
}

// Yozuvlarni kun ichida tartiblash: vaqti borlari vaqt bo'yicha, qolganlari — yangisi tepada
function kunTartib(rows){
  const idxOf = new Map(rows.map((r, i) => [r.id, i]));
  return rows.slice().sort((a, b) => {
    if(a.vaqt && b.vaqt) return a.vaqt.localeCompare(b.vaqt);
    if(a.vaqt) return -1; if(b.vaqt) return 1;
    return idxOf.get(b.id) - idxOf.get(a.id);
  });
}

// Kun chizig'i: vaqti yozilgan ishlar soat bo'yicha, orasidagi bo'sh vaqt bilan (bo'shliqqa bossangiz — o'sha vaqtga yozuv)
function kunChizigiHTML(t, rows){
  const bugun = bugunISO(), now = hozirDaqiqa(), isBugun = t === bugun;
  const timed = rows.filter(r => hmToMin(r.vaqt) != null).sort((a, b) => hmToMin(a.vaqt) - hmToMin(b.vaqt));
  const vaqtsiz = rows.filter(r => hmToMin(r.vaqt) == null);
  const bosh = (s, e, oxirgi) => { const d = e - s; if(d < 5) return "";
    return `<button class="tl2-gap${oxirgi ? " now" : ""}" data-act="entryNew" data-sana="${t}" data-vaqt="${hhmm(s)}" data-amt="${d}">
      <span class="tl2-t num">${hhmm(s)}</span><span class="tl2-rail"></span>
      <span class="tl2-gm">${ic("hourglass")}<span><b class="num">${soat(d)}</b> ${oxirgi ? "hozirgacha yozilmagan" : "bo'sh"}</span></span><span class="tl2-add">${ic("plus")}</span></button>`; };
  let html = "", oldin = null, nowQuydi = false;
  const nowLine = () => `<div class="tl2-now"><span class="tl2-t num">${hhmm(now)}</span><span class="tl2-rail"><i></i></span><span>hozir</span></div>`;
  for(const r of timed){
    const s = hmToMin(r.vaqt), e = Math.min(s + r.daqiqa, 1440), g = katGuruh(r.kat);
    if(isBugun && !nowQuydi && now < s){ if(oldin != null) html += bosh(oldin, Math.min(now, s)); html += nowLine(); nowQuydi = true; oldin = Math.max(oldin == null ? now : oldin, now); }
    if(oldin != null && s > oldin) html += bosh(oldin, s);
    const bal = clamp(Math.round(r.daqiqa * .55), 54, 170);
    html += `<button class="tl2-it g-${g}" data-act="entryEdit" data-id="${esc(r.id)}">
      <span class="tl2-t num">${r.vaqt}</span>
      <span class="tl2-rail"><span class="tl2-pill" style="height:${bal}px">${ic(katIcon(r.kat))}</span></span>
      <span class="tl2-m"><small class="num">${r.vaqt}–${hhmm(e)} (${soat(r.daqiqa)})</small><b>${esc(katNom(r.kat))}</b>${r.izoh ? `<em>${esc(r.izoh)}</em>` : ""}</span>
      <span class="tl2-amt num">−${tanga(r.daqiqa)}</span></button>`;
    oldin = oldin == null ? e : Math.max(oldin, e);
  }
  if(isBugun && !nowQuydi && timed.length){ if(oldin != null && now > oldin) html += bosh(oldin, now, true); html += nowLine(); }
  const yangi = !timed.length ? `<button class="tl2-start" data-act="entryNew" data-sana="${t}"${isBugun ? ` data-vaqt="${hhmm(Math.max(0, now - 60))}" data-amt="60"` : ""}>${ic("plus")}<span><b>Kunni vaqt chizig'iga yozing</b><small>Boshlanish vaqtini belgilasangiz, ishlar shu yerda soat bo'yicha tiziladi</small></span></button>` : "";
  return `${timed.length ? `<div class="tl2">${html}</div>` : yangi}
    ${vaqtsiz.length ? `<div class="sub-h" style="margin-top:${timed.length ? 16 : 14}px">Vaqti belgilanmagan</div><div class="rows">${kunTartib(vaqtsiz).map(yozuvRow).join("")}</div>` : ""}`;
}

  return r;
}

}

// Yangi toifa yoki mavjudini tahrirlash -> Promise<toifa nomi|null>
function toifaTahrir(index){
  return new Promise(resolve => {
    const eski = index != null ? S.toifalar[index] : null;
    const st = {nom: eski ? katNom(eski.nom) : "", guruh: eski ? eski.guruh : "rivoj", icon: eski ? (eski.icon || GURUH[eski.guruh].icon) : "star"};
    const guruhlar = () => GURUH_TARTIB.map(g => `<button type="button" class="chip sm g-${g}${st.guruh === g ? " on" : ""}" data-g="${g}"><span class="gdot"></span>${GURUH[g].nom}</button>`).join("");
    const ikonlar = () => ICON_TANLOV.map(n => `<button type="button" class="icon-b${st.icon === n ? " on" : ""}" data-icon="${n}" aria-label="${n}">${ic(n)}</button>`).join("");
    const o = openSheet({title: eski ? "Toifani tahrirlash" : "Yangi toifa",
      body: `<label class="field" style="margin-top:8px"><span>Toifa nomi</span><input type="text" id="tNom" maxlength="60" placeholder="masalan: Ingliz tili" value="${esc(st.nom)}" autocomplete="off"></label>
        <div class="sub-h">Yo'nalish</div><div class="chips g-${st.guruh}" id="tGur">${guruhlar()}</div>
        <div class="sub-h">Ikonka</div><div class="icon-grid g-${st.guruh}" id="tIc">${ikonlar()}</div>`,
      foot: `${eski ? `<button class="btn danger" id="tDel" style="flex:0 0 auto" aria-label="O'chirish">${ic("trash-2")}</button>` : ""}<button class="btn blue" id="tSave">${eski ? "Saqlash" : "Toifa qo'shish"}</button>`,
      onClose: r => resolve(r || null)});
    const q = s => $(s, o.el);
    o.el.addEventListener("click", async e => {
      const b = e.target.closest("button"); if(!b) return;
      if(b.dataset.g){ st.guruh = b.dataset.g; q("#tGur").innerHTML = guruhlar(); q("#tIc").className = "icon-grid g-" + st.guruh; cyrPass(q("#tGur")); }
      else if(b.dataset.icon){ st.icon = b.dataset.icon; q("#tIc").innerHTML = ikonlar(); }
      else if(b.id === "tSave"){
        const nom = q("#tNom").value.trim().replace(/\s+/g, " ");
        if(!nom){ toast("Toifa nomini kiriting"); return; }
        const sof = s => katNom(s).toLowerCase();
        if(barchaKategoriyalar().some((k, i) => sof(k) === nom.toLowerCase() && !(eski && k === eski.nom))){ toast("Bunday toifa allaqachon bor"); return; }
        let full;
        if(eski){
          full = (eski.nom.match(/^\d+\.?\s*/) || [""])[0] + nom;
          if(full !== eski.nom){   // nomi o'zgardi — shu toifadagi yozuv va shablonlar ham yangilanadi
            for(const r of S.yozuvlar) if(r.kat === eski.nom){ r.kat = full; r.u = nowTs(); markOut("y:" + r.id); }
            for(const s of S.shablonlar) if(s.kat === eski.nom) s.kat = full;
            if(S.timer.kat === eski.nom){ S.timer.kat = full; markOut("c:timer"); }
            markOut("c:shablonlar"); saqlaY();
          }
          eski.nom = full; eski.guruh = st.guruh; eski.icon = st.icon;
        } else {
          const nums = barchaKategoriyalar().map(k => { const m = String(k).match(/^(\d+)/); return m ? +m[1] : 0; });
          full = (Math.max(32, ...nums) + 1) + " " + nom;
          S.toifalar.push({nom: full, guruh: st.guruh, icon: st.icon});
        }
        invalidateIdx(); cfgTouch("toifalar");
        toast(`${ic("check")}<span>${eski ? "Toifa yangilandi" : "Yangi toifa qo'shildi"} · <b>${esc(nom)}</b></span>`);
        ovClose(o, full);
      }
      else if(b.id === "tDel"){
        const bor = S.yozuvlar.some(r => r.kat === eski.nom);
        if(!(await confirmDlg({danger: true, icon: "trash-2", title: "Toifa o'chirilsinmi?", text: bor ? "Bu toifadagi yozuvlar saqlanib qoladi, lekin «Yo'l va boshqa» yo'nalishiga o'tadi." : "Bu toifada yozuv yo'q.", ok: "O'chirish"}))) return;
        S.toifalar.splice(S.toifalar.indexOf(eski), 1); invalidateIdx(); cfgTouch("toifalar"); toast("Toifa o'chirildi"); ovClose(o, null);
      }
    });
  });
}

// Sekundomer holati (S.timer) bulut orqali sinxronlanadi: telefonda boshlab, kompyuterda to'xtatish mumkin.
function timerMs(){ return S.timer.baza + (S.timer.ish ? Math.max(0, nowTs() - S.timer.start) : 0); }
function timerMatn(){
  const tot = Math.floor(timerMs() / 1000), h = Math.floor(tot / 3600), m = Math.floor(tot % 3600 / 60), s = tot % 60;
  return (h > 0 ? String(h).padStart(2, "0") + ":" : "") + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function timerStart(){ if(S.timer.ish) return; S.timer.ish = true; S.timer.start = nowTs(); cfgTouch("timer"); tikBoshla(); }
function timerPause(){ if(!S.timer.ish) return; S.timer.baza = timerMs(); S.timer.ish = false; cfgTouch("timer"); }
function timerReset(){ S.timer.ish = false; S.timer.baza = 0; S.timer.start = 0; cfgTouch("timer"); }
function timerSaqla(){
  const min = Math.round(timerMs() / 60000);
  if(min < 1){ toast("Hali 1 daqiqa ham o'tmadi"); return; }
  const t = bugunISO(); if(guardYopiq(t)) return;
  const bosh = hozirDaqiqa() - min, kat = S.timer.kat;
  timerReset();
  qosh([{sana: t, kat, daqiqa: min, izoh: "Sekundomer bilan o'lchandi", vaqt: bosh >= 0 ? hhmm(bosh) : ""}], `${ic("check")}<span><b>${tanga(min)} tanga</b> sekundomerdan yozildi</span>`);
}
function timerTashqi(){ if(S.timer.ish) tikBoshla(); }

// Fokus 25+5 (shu qurilmada)
const POMO_ISH = 25 * 60, POMO_DAM = 5 * 60;
const pomo = {on: false, run: false, faza: "ish", sikl: 1, end: 0, qoldiq: POMO_ISH};
function pomoFmt(s){ s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function pomoQoldi(){ return pomo.run ? Math.max(0, (pomo.end - Date.now()) / 1000) : pomo.qoldiq; }
function pomoStart(){ if(pomo.run) return; pomo.run = true; pomo.end = Date.now() + pomo.qoldiq * 1000; tikBoshla(); render(); }
function pomoPause(){ if(!pomo.run) return; pomo.qoldiq = pomoQoldi(); pomo.run = false; render(); }
function pomoReset(){ pomo.run = false; pomo.faza = "ish"; pomo.sikl = 1; pomo.qoldiq = POMO_ISH; render(); }
function pomoTik(){
  if(!pomo.run || pomo.end - Date.now() > 0) return;
  if(pomo.faza === "ish"){
    const bosh = hozirDaqiqa() - 25;
    qosh([{sana: bugunISO(), kat: S.timer.kat, daqiqa: 25, izoh: "Fokus sessiya", vaqt: bosh >= 0 ? hhmm(bosh) : ""}]);
    toast(`${ic("check")}<span>${pomo.sikl}-sikl yakunlandi — <b>25 tanga</b> yozildi. Dam oling</span>`);
    pomo.faza = "dam"; pomo.end = Date.now() + POMO_DAM * 1000;
  } else {
    blip(); pomo.sikl++; pomo.faza = "ish"; pomo.end = Date.now() + POMO_ISH * 1000;
    toast(`${ic("play")}<span>${pomo.sikl}-sikl boshlandi — fokus</span>`);
  }
  render();
}

// Har 250 ms: faqat raqam va yoy yangilanadi (butun ekran qayta chizilmaydi)
let _tik = null;
function tikBoshla(){ if(_tik) return; _tik = setInterval(tik, 250); }
function tik(){
  if(!S.timer.ish && !pomo.run){ clearInterval(_tik); _tik = null; }
  if(pomo.on) pomoTik();
  const v = $("#fVaqt");
  if(v && curTab === "fokus") fokusJonli();
  const mt = $("#miniT"); if(mt) mt.textContent = miniVaqt();
  const ht = $("#hozirT"); if(ht) ht.textContent = timerMatn();
}
const DIAL_R = 118, DIAL_C = 2 * Math.PI * DIAL_R;
function fokusJonli(){
  const v = $("#fVaqt"), tg = $("#fTanga"), arc = $("#fArc"), dot = $("#fDot"); if(!v) return;
  let ulush;
  if(pomo.on){
    const q = pomoQoldi(), jami = pomo.faza === "ish" ? POMO_ISH : POMO_DAM;
    v.textContent = pomoFmt(q); ulush = 1 - q / jami;
    if(tg) tg.textContent = kirilmi() ? latKir(pomo.faza === "ish" ? `${pomo.sikl}-sikl · fokus` : "Dam — nafas oling") : (pomo.faza === "ish" ? `${pomo.sikl}-sikl · fokus` : "Dam — nafas oling");
  } else {
    const ms = timerMs(), min = Math.round(ms / 60000);
    v.textContent = timerMatn(); ulush = (ms % 3600000) / 3600000;
    const m = min > 0 ? `${tanga(min)} tanga to'plandi` : "hali 0 tanga";
    if(tg) tg.textContent = kirilmi() ? latKir(m) : m;
  }
  if(arc) arc.style.strokeDashoffset = String(DIAL_C * (1 - clamp(ulush, 0, 1)));
  if(dot){ const a = (clamp(ulush, 0, 1) * 360 - 90) * Math.PI / 180; dot.setAttribute("cx", (160 + DIAL_R * Math.cos(a)).toFixed(2)); dot.setAttribute("cy", (160 + DIAL_R * Math.sin(a)).toFixed(2)); }
}

  const guruhla = (kf, yf) => { const m = new Map(); for(const d of days){ const k = kf(d); if(!m.has(k)) m.set(k, {k, yorliq: yf(k), days: []}); m.get(k).days.push(d); } return Array.from(m.values()); };

function heatKartaHTML(){
  const all = kunlar(), nowY = new Date().getFullYear();
  let minY = nowY; for(const d of all){ const y = +d.slice(0, 4); if(y && y < minY) minY = y; }
  heatYil = clamp(heatYil, minY, nowY);
  const yil = heatYil, start = new Date(yil, 0, 1), end = new Date(yil, 11, 31), lead = (start.getDay() + 6) % 7, today = bugunISO();
  const cols = []; let cur = [];
  for(let k = 0; k < lead; k++) cur.push(null);
  for(const d = new Date(start); d <= end; d.setDate(d.getDate() + 1)){
    const iso = isoOf(d), sp = kunChiqim(iso);
    cur.push({iso, sp, lvl: sp <= 0 ? 0 : sp >= 1380 ? 4 : sp >= 900 ? 3 : sp >= 400 ? 2 : 1, mo: d.getMonth()});
    if(cur.length === 7){ cols.push(cur); cur = []; }
  }
  if(cur.length) cols.push(cur);
  let last = -1;
  const oylar = cols.map(c => { const f = c.find(x => x); let l = ""; if(f && f.mo !== last){ l = OYLAR[f.mo]; last = f.mo; } return `<span>${l}</span>`; }).join("");
  const body = cols.map(c => `<div class="hm-c">${c.map(x => x ? `<i class="l${x.lvl}${x.iso === today ? " today" : ""}" data-d="${x.iso}" title="${sanaQisqa(x.iso)} — ${tanga(x.sp)} / 1440"></i>` : `<i class="void"></i>`).join("")}</div>`).join("");
  const yilK = all.filter(d => d.slice(0, 4) === String(yil));
  return `<section class="card" id="heatKarta"><div class="ch"><div><h2>Yillik xarita</h2><span class="hint">${yilK.length} kun yozilgan, ${yilK.filter(toliqKunmi).length} tasi to'liq</span></div>
      <div class="yil-nav"><button class="ibtn plain" data-act="heatYil" data-n="-1" ${yil <= minY ? "disabled" : ""} aria-label="Oldingi yil">${ic("chevron-left")}</button><b class="num">${yil}</b><button class="ibtn plain" data-act="heatYil" data-n="1" ${yil >= nowY ? "disabled" : ""} aria-label="Keyingi yil">${ic("chevron-right")}</button></div></div>
    <div class="hm-w" id="heatW"><div class="hm-m">${oylar}</div><div class="hm">${body}</div></div>
    <div class="cal-leg" style="justify-content:flex-end;margin-top:8px">Kam <i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> To'liq</div></section>`;
}

function eksportJson(){ return yukla(`vaqt-banki-zaxira-${bugunISO()}.json`, JSON.stringify(toliqZaxira(), null, 1)).then(ok => { if(ok) toast(`${ic("download")}<span>To'liq zaxira yuklab olindi</span>`); return ok; }); }
function eksportCsv(){
  const rows = [["Sana","Boshlanishi","Tanga (daqiqa)","Yo'nalish","Toifa","Izoh"]];
  chiqimlar().slice().sort((a, b) => a.sana < b.sana ? -1 : a.sana > b.sana ? 1 : (a.vaqt || "").localeCompare(b.vaqt || ""))
    .forEach(r => rows.push([r.sana, r.vaqt || "", r.daqiqa, GURUH[katGuruh(r.kat)].nom, r.kat, r.izoh || ""]));
  return yukla(`vaqt-banki-jadval-${bugunISO()}.csv`, "﻿" + rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv;charset=utf-8")
    .then(ok => { if(ok) toast(`${ic("download")}<span>CSV jadval yuklab olindi</span>`); return ok; });
}
function importTanla(){
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
  inp.addEventListener("change", () => { const f = inp.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = () => importQil(String(rd.result)); rd.readAsText(f); });
  inp.click();
}
async function importQil(matn){
  let j; try{ j = JSON.parse(matn); }catch(e){ toast("Fayl o'qilmadi — bu JSON zaxira emas"); return; }
  const arr = Array.isArray(j) ? j : (j && Array.isArray(j.yozuvlar) ? j.yozuvlar : null);
  if(!arr){ toast("Fayl ichida yozuvlar topilmadi"); return; }
  const yangi = arr.map(tozaYozuv).filter(Boolean), soni = yangi.filter(r => r.tur !== "kirim").length;
  if(!soni){ toast("Faylda yaroqli yozuv yo'q"); return; }
  const bor = chiqimlar().length;
  const r = bor ? await confirmDlg({icon: "upload", title: `${tanga(soni)} ta yozuv topildi`, text: "Mavjud yozuvlarga qo'shaymi yoki hammasini fayldagi bilan almashtiraymi? Qo'shishda takrorlar tashlab yuboriladi.", ok: "Qo'shish", alt: "Almashtirish"}) : true;
  if(!r) return;
  if(r === "alt"){
    if(!(await confirmDlg({danger: true, title: "Hozirgi yozuvlar o'chadi", text: `${tanga(bor)} ta mavjud yozuv o'rniga fayldagi ${tanga(soni)} tasi qoladi.${Meta.uid ? " Bu bulutdagi nusxaga ham ta'sir qiladi." : ""}`, ok: "Almashtirish"}))) return;
    entriesReplace(yangi);
  } else {
    const idlar = new Set(S.yozuvlar.map(x => x.id)), sig = x => [x.sana, x.tur, x.kat, x.daqiqa, x.izoh || "", x.vaqt || ""].join("|"), sanoq = new Map();
    for(const x of S.yozuvlar){ const k = sig(x); sanoq.set(k, (sanoq.get(k) || 0) + 1); }
    let n = 0;
    for(const x of yangi){ if(idlar.has(x.id)) continue; const k = sig(x), c = sanoq.get(k) || 0; if(c > 0){ sanoq.set(k, c - 1); continue; }
      x.u = nowTs(); S.yozuvlar.push(x); idlar.add(x.id); markOut("y:" + x.id); if(x.tur !== "kirim") n++; }
    saqlaY(); Bus.emit("local", "yozuv");
    toast(`${ic("check")}<span><b>${tanga(n)}</b> ta yangi yozuv qo'shildi${soni - n > 0 ? `, ${tanga(soni - n)} tasi allaqachon bor edi` : ""}</span>`);
  }
  // to'liq zaxirada sozlamalar ham bo'ladi: faqat hozir bo'sh/standart bo'lgan qismlar to'ldiriladi
  if(!Array.isArray(j)){
    if(Array.isArray(j.toifalar)){ const nomlar = new Set(S.toifalar.map(t => t.nom)); for(const t of tozaCfg("toifalar", j.toifalar)) if(!nomlar.has(t.nom)) S.toifalar.push(t); invalidateIdx(); cfgTouch("toifalar", true); }
    if(r === "alt"){ for(const k of ["byudjet","shablonlar","jamgarma","yopiqOylar"]) if(j[k] !== undefined){ S[k] = tozaCfg(k, j[k]); cfgTouch(k, true); }
      for(const d in (j.rejaKun || {})) if(isIso(d)){ const p = tozaReja(j.rejaKun[d]); if(Object.keys(p).length){ S.rejaKun[d] = p; markOut("r:" + d); } }
      for(const d in (j.kayfiyat || {})){ const v = +j.kayfiyat[d]; if(isIso(d) && v >= 1 && v <= 5){ S.kayfiyat[d] = v; markOut("k:" + d); } }
      saqlaC(); }
    Bus.emit("local", "toifalar");
  }
  if(r === "alt") toast(`${ic("check")}<span>Zaxiradan tiklandi · <b>${tanga(soni)}</b> ta yozuv</span>`);
  namunaBelgi(false);
  const kk = kunlar(); if(kk.length && !kk.includes(tanlangan)) tanlangan = kk[kk.length - 1];
  render();
}

function lockKor(){
  const el = $("#lock"), saqlangan = lsGet("vbPin") || "", uz = /^\d:/.test(saqlangan) ? +saqlangan[0] : 0, hash = uz ? saqlangan.slice(2) : saqlangan;

  el.hidden = false;
  el.innerHTML = `${LOGO_SVG.replace("<svg ", '<svg class="logo" ').replace(/lgA/g, "lgL")}<h2>PIN kodni kiriting</h2><p id="lockM">Shu qurilmada tez ochish uchun</p>

    <div class="pin-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-n="${n}">${n}</button>`).join("")}<button class="ghost" data-chiq>Parol bilan</button><button data-n="0">0</button><button class="ghost" data-del aria-label="O'chirish">${ic("delete")}</button></div>`;
  cyrPass(el);
  const dots = () => $$("#pinDots i", el).forEach((d, i) => d.classList.toggle("on", i < kod.length));
  const xato = () => { const p = $("#pinDots", el); p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake"); $("#lockM", el).textContent = kirilmi() ? latKir("PIN noto'g'ri") : "PIN noto'g'ri"; kod = ""; dots(); vibra(40); };
  const tekshir = async () => {
    if(band) return; band = true;
    const mos = (await vbHash("pin:" + kod)) === hash;
    band = false;
    if(mos){ el.hidden = true; el.innerHTML = ""; document.removeEventListener("keydown", klav); }
    else if(uz || kod.length >= 6) xato();
  };
  const bos = n => { if(kod.length >= (uz || 6)) return; kod += n; dots(); vibra(8); if(uz ? kod.length === uz : kod.length >= 4) tekshir(); };
  const klav = e => { if(el.hidden) return; if(/^\d$/.test(e.key)) bos(e.key); else if(e.key === "Backspace"){ kod = kod.slice(0, -1); dots(); } };
  document.addEventListener("keydown", klav);
  el.onclick = async e => {
    const b = e.target.closest("button"); if(!b) return;
    if(b.dataset.n) bos(b.dataset.n);
    else if(b.dataset.del !== undefined){ kod = kod.slice(0, -1); dots(); }
    else if(b.dataset.chiq !== undefined){
      if(!(await confirmDlg({icon: "key-round", title: "Parol bilan kirasizmi?", text: "PIN o'chiriladi va hisobdan chiqiladi. Email va parol bilan qayta kirsangiz, ma'lumotingiz bulutdan qaytadi.", ok: "Hisobdan chiqish"}))) return;
      if(Sync.token){ try{ await api("POST", "/api/auth/logout", {}, {timeout: 6000}); }catch(_){} }
      document.removeEventListener("keydown", klav); el.hidden = true; el.innerHTML = ""; ovCloseAll(); lokalTozalash(); authKor("kir");
    }
  };
}

function aiVb(text){
  const m = String(text).match(/<vb>([\s\S]*?)<\/vb>/); if(!m) return text;
  const qoldi = String(text).replace(m[0], "").trim();
  let data = null; try{ data = JSON.parse(m[1]); }catch(e){ return qoldi || text; }
  const list = Array.isArray(data && data.yozuvlar) ? data.yozuvlar : null;
  if(!list || !list.length) return qoldi;
  const kats = faolKategoriyalar();
  const tayyor = list.map(e => ({
    sana: isIso(e.sana) ? e.sana : (tanlangan || bugunISO()),
    kat: kats.includes(e.kat) ? e.kat : (kats.find(k => k.toLowerCase().includes(String(e.kat || "").toLowerCase().slice(0, 6))) || "15 Boshqa"),
    daqiqa: clamp(parseInt(e.daqiqa, 10) || 0, 0, KUNLIK), izoh: String(e.izoh || "").slice(0, 120), vaqt: hmToMin(e.vaqt) != null ? e.vaqt : ""
  })).filter(e => e.daqiqa > 0);
  if(!tayyor.length) return qoldi;
  aiKutilgan = tayyor;
  return qoldi || `${tayyor.length} ta yozuv tayyor — pastda tasdiqlang.`;
}
async function aiYubor(matn){
  const inp = aiOyna && $("#aiIn", aiOyna.el);
  const txt = String(matn != null ? matn : (inp ? inp.value : "")).trim();
  if(!txt || aiBand) return;
  if(inp){ inp.value = ""; inp.style.height = "auto"; }
  if(VB_KORGAZMA){ aiTarix.push({role: "user", text: txt}); aiTarix.push({role: "assistant", text: "Ko'rgazma sahifasida AI yordamchi ishlamaydi. Ilovani Render'ga joylab, Profil → AI yordamchi bo'limiga Anthropic API kalitingizni kiritsangiz, shu yerda javob beraman."}); aiChiz(); return; }
  aiTarix.push({role: "user", text: txt}); aiTarix.push({role: "assistant", text: "", yozmoqda: true}); aiChiz();
  aiBand = true; const sb = aiOyna && $("#aiSend", aiOyna.el); if(sb) sb.disabled = true;
  try{
    const msgs = aiTarix.filter(m => !m.yozmoqda).slice(-16).map(m => ({role: m.role === "user" ? "user" : "assistant", content: m.text}));
    const headers = {"Content-Type": "application/json"}, key = (lsGet("vbAiKey") || "").trim();
    if(key){ headers["x-api-key"] = key; headers["anthropic-version"] = "2023-06-01"; headers["anthropic-dangerous-direct-browser-access"] = "true"; }
    const sora = model => fetch("https://api.anthropic.com/v1/messages", {method: "POST", headers, body: JSON.stringify({model, max_tokens: 1000, system: aiTizim(), messages: msgs})});
    let r = await sora(AI_MODEL);
    if(r.status === 404 && AI_MODEL_ZAXIRA) r = await sora(AI_MODEL_ZAXIRA);       // model eskirgan bo'lsa — yangisi bilan
    if(!r.ok){ let d = ""; try{ const j = await r.json(); d = (j && j.error && j.error.message) || ""; }catch(e){} throw new Error("HTTP " + r.status + (d ? ": " + d : "")); }
    const data = await r.json();
    let out = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim() || "(bo'sh javob)";
    aiTarix = aiTarix.filter(m => !m.yozmoqda);
    out = aiVb(out);
    if(out) aiTarix.push({role: "assistant", text: out});
  }catch(e){
    aiTarix = aiTarix.filter(m => !m.yozmoqda);
    aiTarix.push({role: "assistant", text: "AI bilan bog'lana olmadim. " + ((lsGet("vbAiKey") || "").trim() ? "Kalit yoki internet aloqasini tekshiring." : "AI ishlashi uchun Profil → AI yordamchi bo'limiga Anthropic API kalitingizni kiriting.") + (e && e.message && /HTTP/.test(e.message) ? " (" + e.message.slice(0, 120) + ")" : "")});
  }
  aiBand = false; if(sb) sb.disabled = false; aiChiz();
}

// Kunlik eslatma (ilova ochiq turganda)
let _remT = null;
function eslatmaQur(){
  if(_remT){ clearTimeout(_remT); _remT = null; }
  if(!S.sozlama.eslatma) return;
  const m = hmToMin(S.sozlama.vaqt); if(m == null) return;
  const now = new Date(), tgt = new Date(); tgt.setHours(Math.floor(m / 60), m % 60, 0, 0);
  if(tgt <= now) tgt.setDate(tgt.getDate() + 1);
  _remT = setTimeout(() => {
    const t = bugunISO(), sp = kunChiqim(t);
    if(sp < 1380){
      const q = Math.max(KUNLIK - sp, 0);
      try{ if(typeof Notification !== "undefined" && Notification.permission === "granted") new Notification("Vaqt Banki", {body: `Bugun ${tanga(q)} tanga (${soat(q)}) hali yozilmagan. Kuningizni yakunlang.`}); }catch(e){}
      toast(`${ic("bell-ring")}<span>Eslatma: bugun <b>${tanga(q)} tanga</b> hali yozilmagan</span>`, {ms: 6000});
    }
    eslatmaQur();
  }, Math.min(tgt - now, 2147000000));
}

// Haftalik hisobot: 7 kunlik tasma, yo'nalishlar va o'tgan hafta bilan farq
A.haftaSheet = () => {
  const {A: h, B: o} = haftaHisob();
  const YON = {rivoj: 1, soglik: 1, behuda: -1};          // +1: ko'paygani yaxshi, -1: kamaygani yaxshi, 0: betaraf
  const farq = (a, b, yon) => {
    const d = a - b;
    if(Math.abs(d) < 5) return `<span class="pill mute">o'zgarishsiz</span>`;
    const cl = !yon ? "mute" : (d > 0) === (yon > 0) ? "ok" : "bad";
    return `<span class="pill ${cl} num">${ic(d > 0 ? "arrow-up" : "arrow-down")}${soat(Math.abs(d))}</span>`;
  };
  const kunlar7 = h.days.map(d => { const dd = dOf(d), sp = kunChiqim(d);
    return `<button class="hk-r" data-act="hkKun" data-d="${d}" aria-label="${sanaToliq(d)} — ${sp} tanga"><span class="hk-d"><b>${HK_QISQA[dd.getDay()]}</b><small class="num">${dd.getDate()}</small></span>${stackbarHTML(kunGuruh(d), KUNLIK, "sm")}<span class="hk-v num">${sp ? tanga(sp) : "—"}</span></button>`; }).join("");
  const guruhlar = GURUH_TARTIB.filter(g => h.g[g] > 0 || o.g[g] > 0).sort((a, b) => h.g[b] - h.g[a]).map(g =>
    `<div class="row g-${g}"><span class="tile-ic sm">${ic(GURUH[g].icon)}</span><span class="row-main"><b>${GURUH[g].nom}</b><small>${o.n ? "o'tgan hafta " + soat(o.g[g]) : "o'tgan hafta yozilmagan"}</small></span>
      <span class="row-amt num">${soat(h.g[g])}<small>${o.n ? farq(h.g[g], o.g[g], YON[g] || 0) : ""}</small></span></div>`).join("");
  const df = h.ch - o.ch, som = S.sozlama.som || 0;
  openSheet({title: "Haftalik hisobot", sub: `${sanaQisqa(h.days[0])} – ${sanaQisqa(h.days[6])}`,
    body: h.n ? `<div class="duo"><div><small>Yozilgan</small><b class="num">${tanga(Math.round(h.ch / 60))}</b><span>soat</span></div><div><small>To'liq kunlar</small><b class="num">${h.full}</b><span>/ 7</span></div></div>
        <p class="note" style="margin:10px 2px 0">${o.n ? (Math.abs(df) < 30 ? "O'tgan hafta bilan deyarli bir xil yozilgan." : `O'tgan haftadan <b>${soat(Math.abs(df))}</b> ${df > 0 ? "ko'p" : "kam"} yozilgan.`) : "O'tgan hafta yozilmagan — solishtirish keyingi haftadan boshlanadi."}${h.g.behuda > 0 && som > 0 ? ` Behuda vaqt <b class="num">${somF(h.g.behuda * som)}</b>ga teng.` : ""}</p>
        <div class="sub-h">Kunma-kun</div><div class="hk">${kunlar7}</div>
        <div class="sub-h">Yo'nalishlar</div><div class="rows">${guruhlar}</div>`
      : `<div class="empty"><div class="art">${ic("clipboard-list")}</div><p>Oxirgi 7 kunda yozuv yo'q. Bir necha kun yozib boring — hafta yakuni shu yerda chiqadi.</p></div>`,
    foot: h.n ? `<button class="btn ghost" data-act="hfNusxa">${ic("copy")}Nusxalash</button><button class="btn blue" data-act="hfAi">${ic("sparkles")}AI tahlil qilsin</button>` : ""});
};
