}
/* Mavsumiy tema — fon yog'dusi rangi o'zgaradi */
[data-mavsum="navroz"]{--aura-a:rgba(120,214,150,.55); --aura-b:rgba(255,170,200,.42)}
[data-mavsum="mustaqillik"]{--aura-a:rgba(40,150,220,.55); --aura-b:rgba(60,190,110,.40)}
[data-mavsum="ramazon"]{--aura-a:rgba(92,84,210,.58); --aura-b:rgba(240,190,110,.34)}

.g-uyqu{--g:var(--g-uyqu)} .g-asosiy{--g:var(--g-asosiy)} .g-rivoj{--g:var(--g-rivoj)} .g-yumush{--g:var(--g-yumush)}
.g-ijtimoiy{--g:var(--g-ijtimoiy)} .g-soglik{--g:var(--g-soglik)} .g-ish{--g:var(--g-ish)} .g-behuda{--g:var(--g-behuda)} .g-yol{--g:var(--g-yol)}

*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
body{background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;font-weight:500;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;min-height:100dvh;
  overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
a{color:var(--blue-ink);text-decoration:none}
img,svg,canvas{max-width:100%}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}
::selection{background:var(--blue);color:#fff}

.ic{width:22px;height:22px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.num{font-variant-numeric:tabular-nums;white-space:nowrap;word-spacing:.06em}
.muted{color:var(--tx-2)} .faint{color:var(--tx-3)}
.ok-t{color:var(--ok)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Fon yog'dusi (aurora) — statik gradient, animatsiyasiz */
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 460px at 82% -10%,var(--aura-a) 0%,transparent 62%),
  radial-gradient(760px 420px at -6% -4%,var(--aura-b) 0%,transparent 58%),
  var(--bg)}

/* Yuklanish ekrani */
.boot{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:var(--bg);transition:opacity .28s ease,visibility .28s}
.boot.out{opacity:0;visibility:hidden}
.boot .logo{width:84px;height:84px;border-radius:24px;box-shadow:0 24px 50px -18px rgba(63,142,232,.75)}

/* ---------------- Ilova qobig'i ---------------- */
.app{min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--nav-h) + 54px + env(safe-area-inset-bottom))}
.screen{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
.screen.enter{animation:scr-in .22s ease both}
@keyframes scr-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stack-v{display:flex;flex-direction:column;gap:14px}
.cols{display:flex;flex-direction:column;gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media(min-width:900px){
  .screen{max-width:1120px;padding:26px 30px 0}
  .cols{display:grid;grid-template-columns:minmax(0,1.04fr) minmax(0,.96fr);gap:20px;align-items:start}
  .col{gap:18px}
  .stack-v{gap:18px}
}

/* ---------------- Sarlavha (salom + tugmalar) ---------------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.avatar{width:50px;height:50px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;position:relative;
  font-weight:800;font-size:19px;color:#fff;background:var(--grad-fab)}
.avatar::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--blue-2);opacity:.55}
.avatar.lg{width:76px;height:76px;font-size:30px}
.hello{min-width:0;flex:1;text-align:left;display:block}
.hello small{display:block;font-size:13px;color:var(--tx-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ibtn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);
  color:var(--tx);box-shadow:var(--shadow);position:relative;transition:transform .12s ease,background .15s}
.ibtn:active{transform:scale(.94)}
.ibtn.round{border-radius:50%}
.ibtn.plain{background:transparent;border-color:transparent;box-shadow:none}
.ibtn .dot{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--card)}
.sync-b.live{color:var(--ok)} .sync-b.busy{color:var(--blue)} .sync-b.off{color:var(--warn)} .sync-b.local{color:var(--tx-3)} .sync-b.err{color:var(--bad)}
.sync-b.busy .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-b .cnt{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--warn);color:#241a00;
  font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}

/* Sahifa sarlavhasi (ichki ekranlar) */
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px;min-height:46px}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.025em;flex:1;min-width:0;line-height:1.15}
.ph .sub{display:block;font-size:13px;font-weight:500;color:var(--tx-2);letter-spacing:0;margin-top:2px}

/* ---------------- Kartalar ---------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.pad0{padding:0;overflow:hidden}
.card.flat{box-shadow:none}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h2,.sec h2{font-size:17px;font-weight:800;letter-spacing:-.015em}
.ch .hint,.sec .hint{font-size:12.5px;color:var(--tx-2);font-weight:500}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 4px -2px}
.link{color:var(--blue-ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;padding:6px 2px}
.link .ic{width:16px;height:16px}
.link:active{opacity:.6}
.note{font-size:12.5px;color:var(--tx-2);line-height:1.5}

/* Rangli ikonka plitkasi */
.tile-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
  background:color-mix(in srgb,var(--g,var(--blue)) 15%,transparent);color:color-mix(in srgb,var(--g,var(--blue)) 82%,var(--tx))}
[data-theme="dark"] .tile-ic{background:color-mix(in srgb,var(--g,var(--blue)) 24%,transparent);color:color-mix(in srgb,var(--g,var(--blue)) 60%,#fff)}
.tile-ic.sm{width:38px;height:38px;border-radius:12px} .tile-ic.sm .ic{width:19px;height:19px}
.tile-ic.ok{--g:var(--ok)} .tile-ic.bad{--g:var(--bad)} .tile-ic.warn{--g:var(--gold)} .tile-ic.blue{--g:var(--blue)} .tile-ic.violet{--g:var(--violet)}
.gdot{width:10px;height:10px;border-radius:4px;background:var(--g,var(--tx-3));flex:0 0 auto;display:inline-block}

/* ---------------- Tugmalar ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:26px;
  font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;transition:transform .12s ease,filter .15s,opacity .15s;position:relative}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.5}
.btn .ic{width:20px;height:20px}
.btn.grad{background:var(--grad);color:#fff;box-shadow:0 16px 28px -16px rgba(63,142,232,.9)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 16px 28px -18px var(--blue)}
.btn.soft{background:var(--blue-soft);color:var(--blue-ink)}
.btn.ghost{background:var(--card-2);color:var(--tx);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.dashed{background:transparent;border:1.5px dashed color-mix(in srgb,var(--blue) 55%,transparent);color:var(--blue-ink)}
.btn.sm{min-height:40px;padding:0 16px;border-radius:20px;font-size:14px;font-weight:700}
.btn.xs{min-height:32px;padding:0 12px;border-radius:16px;font-size:12.5px;font-weight:700}
.btn.wide{width:100%}
.btn.busy{color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1}

/* ---------------- Chiplar ---------------- */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px;scroll-snap-type:x proximity}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);
  font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;flex:0 0 auto;transition:transform .12s,background .15s,border-color .15s}
.chip:active{transform:scale(.96)}
.chip .ic{width:17px;height:17px}
.chip b{font-weight:800}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.dash{background:transparent;border:1.5px dashed color-mix(in srgb,var(--blue) 55%,transparent);color:var(--blue-ink);font-weight:700}
.chip.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:17px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:700;white-space:nowrap}
.pill .ic{width:14px;height:14px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.blue{background:var(--blue-soft);color:var(--blue-ink)}
.pill.mute{background:var(--card-3);color:var(--tx-2)}

/* Davr tasmasi (Orrin: SEN 26 · OKT 26 …) */
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px}
.strip::-webkit-scrollbar{display:none}
.strip .sp{flex:0 0 auto;min-height:42px;padding:0 16px;border-radius:21px;font-weight:800;font-size:14.5px;letter-spacing:.01em;color:var(--tx-3);
  display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;transition:background .18s,color .18s}
.strip .sp.on{background:var(--blue);color:#fff;box-shadow:0 12px 20px -12px var(--blue)}
@media(min-width:900px){ .strip,.chips.scroll{margin:0;padding-left:0;padding-right:0} }

/* Segment (Orrin: Goals | Debts) */
.seg{display:flex;padding:5px;border-radius:30px;border:1px solid var(--line);background:var(--card);position:relative}
.seg button{flex:1;min-height:44px;border-radius:24px;font-weight:800;font-size:15px;color:var(--tx-3);transition:color .18s,background .18s;padding:0 10px;white-space:nowrap}
.seg button.on{background:var(--blue-soft);color:var(--blue-ink)}
[data-theme="dark"] .seg{background:transparent}
[data-theme="dark"] .seg button.on{background:#12172e}
.seg.sm button{min-height:36px;font-size:13.5px}

/* ---------------- Maydonlar (Orrin: konturli, suzuvchi yorliq) ---------------- */
.field{position:relative;display:block}
.field>span{position:absolute;left:18px;top:-9px;padding:0 6px;font-size:12.5px;font-weight:600;color:var(--tx-2);background:var(--fbg,var(--card));border-radius:6px;z-index:1;pointer-events:none}
.field input,.field textarea,.field .fake{width:100%;min-height:58px;padding:0 20px;border-radius:24px;border:1.5px solid var(--line);
  background:transparent;color:var(--tx);font-size:16px;font-weight:600;transition:border-color .15s,box-shadow .15s;display:flex;align-items:center;text-align:left}
.field textarea{padding:16px 20px;min-height:96px;resize:vertical;line-height:1.5;display:block}
.field input::placeholder,.field textarea::placeholder{color:var(--tx-3);font-weight:500}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.field .fake{cursor:pointer;gap:10px;justify-content:space-between}
.field .fake .ic{color:var(--tx-3);width:18px;height:18px}
.field.has-btn input{padding-right:54px}
.field .in-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--tx-3)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type="time"]::-webkit-calendar-picker-indicator,input[type="date"]::-webkit-calendar-picker-indicator{opacity:.55;filter:var(--pick-filter,none)}
[data-theme="dark"] input[type="time"]::-webkit-calendar-picker-indicator,[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator{opacity:.85}
[data-theme="dark"]{--pick-filter:invert(1)}
input[type="number"]{-moz-appearance:textfield;appearance:textfield}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.err{color:var(--bad);font-size:13.5px;font-weight:600;line-height:1.4}
.err:empty{display:none}

/* O'chirgich */
.sw{position:relative;width:52px;height:32px;flex:0 0 auto;display:inline-block}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--card-3);border:1px solid var(--line);transition:background .2s,border-color .2s}
.sw i::after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
.sw input:checked+i{background:var(--blue);border-color:var(--blue)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--blue);outline-offset:2px}

/* ---------------- Ro'yxat qatorlari ---------------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 4px;width:100%;text-align:left;min-width:0;transition:background .12s}
button.row:active,.row.tap:active{background:var(--card-2)}
.row+.row{border-top:1px solid var(--line-2)}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:block;font-size:12.5px;color:var(--tx-2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-main small.wrap{white-space:normal}
.row-amt{flex:0 0 auto;text-align:right;font-weight:800;font-size:15.5px;letter-spacing:-.01em}
.row-amt small{display:block;font-size:12px;color:var(--tx-3);font-weight:600;margin-top:1px}
.row-amt.in{color:var(--ok)}
.row .chev{color:var(--tx-3);width:18px;height:18px}

/* Bo'sh holat */
.empty{text-align:center;padding:26px 14px 22px}
.empty .art{width:92px;height:92px;margin:0 auto 14px;border-radius:32px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-ink);transform:rotate(-6deg)}
.empty .art .ic{width:40px;height:40px;transform:rotate(6deg)}
.empty p{font-size:15px;color:var(--tx-2);max-width:320px;margin:0 auto 8px;line-height:1.5}
.empty .link{font-size:16px}

/* Yuritgich (progress) */
.meter{height:9px;border-radius:5px;background:color-mix(in srgb,var(--g,var(--blue)) 16%,transparent);overflow:hidden;position:relative}
.meter>i{display:block;height:100%;border-radius:5px;background:var(--g,var(--blue));transition:width .45s cubic-bezier(.2,.8,.2,1)}
.meter.thick{height:12px;border-radius:6px}

/* Qatlamli tasma (taqsimot) */
.stackbar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--card-3)}
.stackbar>i{display:block;height:100%;background:var(--g);min-width:3px;transition:flex-grow .45s cubic-bezier(.2,.8,.2,1)}
.stackbar>i:first-child{border-radius:7px 0 0 7px} .stackbar>i:last-child{border-radius:0 7px 7px 0}
.stackbar>i.rest{background:transparent;min-width:0}
.stackbar.sm{height:7px;border-radius:4px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
}

/* ============================================================
   Qobiq: liquid glass pastki panel, suzuvchi tugmalar, oynalar
   ============================================================ */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;pointer-events:none;
  padding:0 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.dock>*{pointer-events:auto}

/* --- Liquid glass navigatsiya --- */
.nav{position:relative;width:100%;max-width:468px;height:var(--nav-h);border-radius:calc(var(--nav-h) / 2);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:stretch;padding:6px;
  background:var(--glass);border:1px solid var(--glass-brd);
  -webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.12);
  isolation:isolate}
/* shisha ustidagi yaltiroq chiziq */
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
  background:linear-gradient(112deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 26%,rgba(255,255,255,0) 72%,rgba(255,255,255,.22) 100%);opacity:.75}
[data-theme="dark"] .nav::before{opacity:.22}
/* aktiv tab ostidagi suyuq "linza" */
.nav-lens{position:absolute;z-index:1;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:28px;
  background:var(--lens);box-shadow:var(--lens-shadow);transform:translateX(calc(var(--i,0) * 100%));
  transition:transform .46s cubic-bezier(.34,1.36,.44,1)}
.nav-lens.squish{animation:lens .46s ease}
@keyframes lens{0%{scale:1 1}40%{scale:1.14 .9}100%{scale:1 1}}
.nav-b{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:26px;color:var(--tx-2);font-size:11.5px;font-weight:700;letter-spacing:-.01em;transition:color .2s;min-width:0}
.nav-b .ic{width:23px;height:23px;transition:transform .3s cubic-bezier(.34,1.5,.5,1)}
.nav-b.on{color:var(--blue-ink)}
.nav-b.on .ic{transform:translateY(-1px) scale(1.06)}
.nav-b:active .ic{transform:scale(.9)}
[data-theme="dark"] .nav-b{color:#9aa1c4}
[data-theme="dark"] .nav-b.on{color:#fff}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .nav{background:var(--card)}
}

/* --- Suzuvchi tugmalar --- */
.fabs{position:absolute;right:max(16px,calc(50% - 644px));bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:12px;transition:transform .28s cubic-bezier(.3,1.2,.4,1),opacity .2s}
.fab{display:grid;place-items:center;color:#fff;transition:transform .16s cubic-bezier(.3,1.4,.5,1)}
.fab:active{transform:scale(.92)}
.fab-add{width:64px;height:64px;border-radius:22px;background:var(--grad-fab);box-shadow:0 18px 30px -12px rgba(63,120,240,.85)}
.fab-add .ic{width:30px;height:30px;stroke-width:2.4}
.fab-ai{width:48px;height:48px;border-radius:17px;background:var(--grad-ai);box-shadow:0 14px 24px -12px rgba(95,79,230,.9)}
.fab-ai .ic{width:22px;height:22px}
.dock.no-fab .fabs{transform:translateY(20px) scale(.9);opacity:0;pointer-events:none}

/* --- Ishlayotgan sekundomer (kichik tabletka) --- */
.mini{align-self:flex-start;margin:0 0 10px max(0px,calc(50% - 234px));display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 12px;
  border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-lg);font-weight:800;font-size:15px}
.mini .pulse{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.mini small{font-weight:600;color:var(--tx-2);font-size:12.5px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------------- Oynalar (overlay) ---------------- */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding-bottom:var(--kb,0px)}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .26s ease}
.ov.in .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:560px;max-height:calc(100dvh - 28px - env(safe-area-inset-top) - var(--kb,0px));display:flex;flex-direction:column;
  background:var(--card);border-radius:30px 30px 0 0;border:1px solid var(--line);border-bottom:none;box-shadow:var(--shadow-lg);
  transform:translateY(104%);transition:transform .36s cubic-bezier(.22,1,.3,1);--fbg:var(--card)}
.ov.in .sheet{transform:none}
.sheet.drag{transition:none}
.sheet.full{height:calc(100dvh - 28px - env(safe-area-inset-top) - var(--kb,0px))}
.grab{flex:0 0 auto;height:22px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::after{content:"";width:44px;height:5px;border-radius:3px;background:var(--line);}
[data-theme="dark"] .grab::after{background:rgba(255,255,255,.22)}
.sheet-h{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:2px 12px 10px 22px;touch-action:none}
.sheet-h h3{flex:1;font-size:20px;font-weight:800;letter-spacing:-.02em;min-width:0}
.sheet-h h3 small{display:block;font-size:13px;font-weight:500;color:var(--tx-2);letter-spacing:0;margin-top:1px}
.sheet-b{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:8px 20px 18px;-webkit-overflow-scrolling:touch}
.sheet-f{flex:0 0 auto;padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2);display:flex;gap:10px}
.sheet-f .btn{flex:1}
@media(min-width:760px){
  .ov{align-items:center;padding:24px}
  .sheet{border-radius:30px;border-bottom:1px solid var(--line);max-height:min(760px,calc(100dvh - 48px));transform:translateY(18px) scale(.97);opacity:0;
    transition:transform .26s cubic-bezier(.22,1,.3,1),opacity .2s ease}
  .sheet.full{height:min(760px,calc(100dvh - 48px))}
  .ov.in .sheet{opacity:1}
  .grab{display:none}
  .sheet-h{padding-top:18px}
  .sheet-f{padding-bottom:18px}
}

/* Tasdiqlash oynasi */
.ov.center{align-items:center;padding:24px}
.dlg{position:relative;width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:24px 22px 20px;
  box-shadow:var(--shadow-lg);transform:scale(.94);opacity:0;transition:transform .24s cubic-bezier(.3,1.3,.5,1),opacity .18s;text-align:center}
.ov.in .dlg{transform:none;opacity:1}
.dlg .tile-ic{margin:0 auto 14px;width:56px;height:56px;border-radius:19px}
.dlg h3{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.dlg p{color:var(--tx-2);font-size:14.5px;line-height:1.5;margin-bottom:20px}
.dlg .btn-row{flex-direction:column}

/* Menyu (⋮) */
.ov.pop{align-items:stretch;justify-content:stretch}
.ov.pop .scrim{background:transparent}
.menu{position:absolute;min-width:240px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:8px;
  box-shadow:var(--shadow-lg);transform-origin:top right;transform:scale(.9);opacity:0;transition:transform .2s cubic-bezier(.3,1.3,.5,1),opacity .15s}
.ov.in .menu{transform:none;opacity:1}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;border-radius:16px;font-weight:700;font-size:15.5px;text-align:left}
.menu button:active,.menu button:hover{background:var(--card-2)}
.menu button .ic{color:var(--tx-2)}
.menu button.danger,.menu button.danger .ic{color:var(--bad)}

/* Xabarcha (toast) */
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom));z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:min(92vw,440px);padding:12px 16px;border-radius:20px;background:#12162f;color:#fff;
  font-size:14px;font-weight:600;line-height:1.35;box-shadow:0 20px 40px -16px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.12);
  transform:translateY(14px) scale(.96);opacity:0;transition:transform .28s cubic-bezier(.3,1.3,.5,1),opacity .2s}
.toast.in{transform:none;opacity:1}
/* telefonda: «+» tugmasini to'smasligi uchun chapga suriladi; sekundomer tabletkasi ko'rinsa — undan yuqorida;
   oyna ochiq bo'lsa — tepada (pastdagi tugmalarni to'smaydi) */
@media(max-width:640px){
  .toasts{align-items:flex-start;padding:0 96px 0 16px}
  .toast{max-width:100%}
  .has-mini .toasts{bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom))}
  .page-open .toasts{bottom:calc(22px + env(safe-area-inset-bottom));align-items:center;padding:0 14px}
  .ov-open .toasts{bottom:auto;top:calc(12px + env(safe-area-inset-top));align-items:center;padding:0 14px}
  .ov-open .toast{transform:translateY(-14px)}
  .ov-open .toast.in{transform:none}
}
.toast b{color:#9fdcff;font-weight:800}
.toast .ic{width:18px;height:18px;flex:0 0 auto;color:#8fe3c7}
.toast button{color:#9fb4ff;font-weight:800;padding:4px 2px 4px 8px;flex:0 0 auto}

/* ---------------- Ichki sahifalar (Profil va h.k.) ---------------- */
.page{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);
  transition:transform .34s cubic-bezier(.22,1,.3,1);-webkit-overflow-scrolling:touch}
.page::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(900px 460px at 82% -10%,var(--aura-a) 0%,transparent 62%),var(--bg)}
.page.in{transform:none}
.page-in{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.page-top{display:flex;align-items:center;gap:14px;min-height:52px;margin-bottom:2px}
.page-top h1{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0}
.back{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);flex:0 0 auto}
.back:active{transform:scale(.94)}
@media(min-width:900px){
  .page{background:transparent;display:flex;justify-content:flex-end;transform:none;opacity:0;transition:opacity .2s}
  .page::before{background:var(--scrim)}
  .page.in{opacity:1}
  .page-in{width:100%;max-width:520px;margin:0;background:var(--bg);min-height:100%;padding:22px 24px 40px;box-shadow:var(--shadow-lg);
    transform:translateX(40px);transition:transform .3s cubic-bezier(.22,1,.3,1);height:max-content}
  .page.in .page-in{transform:none}
}

/* ---------------- Kirish ekrani (Orrin) ---------------- */
.auth{position:fixed;inset:0;z-index:200;overflow-y:auto;background:
  radial-gradient(760px 420px at 100% -6%,rgba(34,160,150,.62) 0%,transparent 60%),
  radial-gradient(820px 520px at 0% 0%,rgba(40,60,210,.72) 0%,transparent 62%),
  #04051a;color:#fff;color-scheme:dark;
  --card:#0e1124;--card-2:#151931;--line:rgba(255,255,255,.22);--tx:#fff;--tx-2:#c3c8de;--tx-3:#8a90ad;--blue:#4d6bfa;--blue-ink:#6f8aff;--blue-soft:rgba(77,107,250,.22);--fbg:transparent;
  --bad:#ff7d86;--ok:#2ed39a}
.auth-in{max-width:460px;margin:0 auto;min-height:100%;padding:calc(34px + env(safe-area-inset-top)) 22px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:44px}
.brand svg{width:54px;height:54px;border-radius:16px;box-shadow:0 18px 34px -14px rgba(63,142,232,.9)}
.brand b{font-size:28px;font-weight:700;letter-spacing:-.03em}
.auth h1{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.12;margin-bottom:12px}
.auth .lead{font-size:16.5px;color:var(--tx-2);line-height:1.45;margin-bottom:30px;max-width:380px}
.auth form{display:flex;flex-direction:column;gap:18px}
.auth .field input{min-height:64px;border-radius:28px;background:rgba(4,5,26,.35)}
.auth .field>span{background:#0a0d2c}
.auth .btn{min-height:62px;border-radius:30px;font-size:18px}
.auth-links{display:flex;justify-content:space-between;gap:12px;margin-top:20px;padding:0 6px}
.auth-links button,.auth .skip{color:var(--blue-ink);font-weight:800;font-size:16.5px;padding:8px 2px}
.auth .or{display:flex;align-items:center;gap:16px;color:var(--tx-2);margin:22px 0 16px;font-size:14px}
.auth .or::before,.auth .or::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.16)}
.auth .skip{display:block;margin:0 auto;text-align:center}
.auth .foot{margin-top:auto;padding-top:26px;text-align:center;font-size:12.5px;color:var(--tx-3);line-height:1.6}
.auth .info{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:13.5px;color:var(--tx-2);line-height:1.5;margin-bottom:22px}
.auth .info .ic{color:#7fd9ff;flex:0 0 auto;margin-top:1px}
.auth .info b{color:#fff}
.auth .info.warn{background:rgba(255,196,84,.10);border-color:rgba(255,196,84,.34)}
.auth .info.warn .ic{color:#ffc454}
.auth details{margin-top:18px;font-size:13.5px;color:var(--tx-2)}
.auth details summary{cursor:pointer;font-weight:700;padding:6px 4px;list-style:none;display:flex;align-items:center;gap:8px}
.auth details summary::-webkit-details-marker{display:none}
.auth details .field{margin-top:14px}
.wake{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--tx-2);min-height:22px}
.wake i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;flex:0 0 auto}

/* ---------------- PIN qulf ---------------- */
.lock{position:fixed;inset:0;z-index:300;background:
  radial-gradient(820px 520px at 50% -10%,rgba(40,60,210,.7) 0%,transparent 62%),#04051a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lock svg.logo{width:64px;height:64px;border-radius:19px;margin-bottom:22px}
.lock h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.lock p{color:#b9bed8;font-size:14.5px;margin-bottom:26px;min-height:21px}
.pin-dots{display:flex;gap:16px;margin-bottom:34px}
.pin-dots i{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.45);transition:background .12s,transform .12s}
.pin-dots i.on{background:#fff;border-color:#fff;transform:scale(1.12)}
.pin-dots.shake{animation:shake .36s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pin-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px}
.pin-pad button{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.09);color:#fff;font-size:28px;font-weight:700;display:grid;place-items:center;transition:background .12s,transform .1s}
.pin-pad button:active{background:rgba(255,255,255,.24);transform:scale(.94)}
.pin-pad button.ghost{background:transparent;font-size:14px;font-weight:700;color:#9fb4ff}

/* Tanga yomg'iri */
#fx{position:fixed;inset:0;pointer-events:none;z-index:350;overflow:hidden}
#fx i{position:absolute;top:-24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2c2,var(--gold) 62%,#c98a12);animation:coinfall linear forwards}
@keyframes coinfall{to{transform:translateY(112vh) rotate(540deg)}}

/* ============================================================
   Asosiy ekran, yozuv oynasi, tanlagichlar
   ============================================================ */
/* Telefonda bloklar tartibi sinflar bilan (o1..o9), kompyuterda ikki ustun */
.home .col{display:contents}
.home>.col>*{min-width:0}
.o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}.o8{order:8}.o9{order:9}
@media(min-width:900px){ .home .col{display:flex} .home .col>*{order:0} }

/* --- Qoldiq kartasi --- */
.hero{position:relative;border-radius:var(--r-xl);padding:22px 22px 20px;color:#fff;background:var(--hero);box-shadow:var(--hero-shadow);overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28) 0%,rgba(255,255,255,0) 68%)}
.hero::after{content:"";position:absolute;z-index:-1;right:22px;top:22px;width:58px;height:58px;border-radius:50%;
  border:2px solid rgba(255,255,255,.32);box-shadow:0 0 0 9px rgba(255,255,255,.08),0 0 0 22px rgba(255,255,255,.05)}
[data-theme="dark"] .hero{border:1px solid rgba(255,255,255,.10)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:74px}
.hero-lbl{display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:16px;letter-spacing:-.01em;text-align:left;min-width:0;white-space:nowrap}
.hero-lbl b{font-weight:700}
.hero-lbl span{font-weight:500;opacity:.84}
.hero-lbl .ic{width:17px;height:17px;opacity:.75}
.hero-num{display:flex;align-items:baseline;gap:9px;margin-top:8px}
.hero-num b{font-size:clamp(50px,15.5vw,68px);font-weight:800;letter-spacing:-.045em;word-spacing:.16em;line-height:1;font-variant-numeric:normal}
.hero-num span{font-size:17px;font-weight:600;opacity:.86}
.hero.over .hero-num b{color:#ffd1d6}
.hero-sub{font-size:14px;opacity:.86;margin-top:6px;font-weight:500}
.dayline{margin-top:18px}
.dl-track{position:relative;height:10px;border-radius:5px;background:rgba(255,255,255,.22)}
.dl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#fff;transition:width .5s cubic-bezier(.2,.8,.2,1);min-width:0}
.dl-now{position:absolute;top:-5px;width:3px;height:20px;border-radius:2px;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 3px rgba(255,255,255,.22)}
.dl-lbl{position:relative;display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;opacity:.8;margin-top:9px;height:15px}
.dl-lbl .now{position:absolute;transform:translateX(-50%);opacity:1;font-weight:800;white-space:nowrap}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hchip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:20px;background:rgba(255,255,255,.2);color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.hchip.line{background:transparent;border:1.5px solid rgba(255,255,255,.45)}
.hchip .ic{width:16px;height:16px}
.hchip b{color:#ffd9de;font-weight:800}
button.hchip:active{transform:scale(.96)}

/* --- Kunlar tasmasi --- */
.strip.days{gap:8px;padding-top:2px;padding-bottom:2px;align-items:stretch}
.dchip{flex:0 0 auto;width:50px;height:68px;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--tx-2);
  position:relative;transition:background .18s,color .18s}
.dchip small{font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;opacity:.9}
.dchip b{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--tx)}
.dchip i{width:22px;height:4px;border-radius:2px;background:var(--card-3);margin-top:4px;position:relative;overflow:hidden}
.dchip i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0) * 100%);background:var(--blue);border-radius:2px}
.dchip.today small{color:var(--blue-ink)}
.dchip.on{background:var(--blue);color:#fff;box-shadow:0 12px 20px -12px var(--blue)}
.dchip.on b,.dchip.on small{color:#fff}
.dchip.on i{background:rgba(255,255,255,.3)} .dchip.on i::after{background:#fff}
.dchip.cal{background:var(--card);border:1px solid var(--line);color:var(--blue-ink)}

/* --- Foydali / Behuda --- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{padding:16px}
.tile-h{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:600;color:var(--tx-2)}
.tile-v{display:flex;align-items:baseline;gap:6px;margin-top:12px}
.tile-v b{font-size:25px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:normal}
.tile-v span{font-size:13.5px;color:var(--tx-2);font-weight:600}
.tile>small{display:block;font-size:12.5px;color:var(--tx-3);margin-top:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* --- Taqsimot afsonasi --- */
.lg{display:grid;grid-template-columns:1fr;gap:2px;margin-top:14px}
.lg-r{display:flex;align-items:center;gap:10px;padding:7px 2px;font-size:14.5px}
.lg-r+.lg-r{border-top:1px solid var(--line-2)}
.lg-n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-r b{font-weight:800}
.lg-r small{width:40px;text-align:right;color:var(--tx-3);font-weight:600;font-size:12.5px}

/* --- Kun xaritasi --- */
.tl-track{position:relative;height:34px;border-radius:12px;background:var(--card-2);overflow:hidden;
  background-image:linear-gradient(90deg,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%,transparent 25%,transparent calc(50% - 1px),var(--line) calc(50% - 1px),var(--line) 50%,transparent 50%,transparent calc(75% - 1px),var(--line) calc(75% - 1px),var(--line) 75%,transparent 75%)}
.tl-track i{position:absolute;top:5px;bottom:5px;border-radius:6px;background:var(--g);box-shadow:0 0 0 1px var(--card-2)}
.tl-track b{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);transform:translateX(-50%)}
.tl-ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx-3);font-weight:600;margin-top:6px;padding:0 1px}

/* --- Kayfiyat --- */
.mood{display:flex;justify-content:space-between;gap:8px}
.mood button{flex:1;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--card-2);color:var(--tx-3);border:1.5px solid transparent;transition:transform .15s cubic-bezier(.3,1.5,.5,1),background .15s,color .15s}
.mood button .ic{width:26px;height:26px}
.mood button:active{transform:scale(.92)}
.mood .m1.on{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
.mood .m2.on{color:var(--g-asosiy);background:color-mix(in srgb,var(--g-asosiy) 16%,transparent);border-color:var(--g-asosiy)}
.mood .m3.on{color:var(--tx);background:var(--card-3);border-color:var(--tx-3)}
.mood .m4.on{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)}
.mood .m5.on{color:var(--blue-ink);background:var(--blue-soft);border-color:var(--blue)}
.mood button.on{transform:scale(1.04)}

/* --- Kuzatuv --- */
.insight{display:flex;gap:14px;align-items:flex-start}
.insight h3{font-size:16px;font-weight:800;letter-spacing:-.015em;margin-bottom:4px}
.insight p{font-size:14px;color:var(--tx-2);line-height:1.5}
.insight p b{color:var(--tx);font-weight:700}
.insight .link{margin-top:4px}

/* ---------------- Yozuv oynasi ---------------- */
.amt{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 2px}
.amt.shake{animation:shake .36s}
.amt-b{width:50px;height:50px;border-radius:50%;background:var(--card-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx-2);flex:0 0 auto;transition:transform .1s}
.amt-b:active{transform:scale(.9)}
.amt-c{position:relative;display:flex;align-items:baseline;justify-content:center;gap:8px;min-width:0;cursor:text;padding-bottom:6px}
.amt-c input{width:1ch;min-width:1ch;max-width:4.4ch;border:none;background:transparent;text-align:center;font-size:60px;font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--tx);padding:0;caret-color:var(--blue);font-variant-numeric:tabular-nums;box-sizing:content-box}
.amt-c input:focus,.amt-c input:focus-visible{outline:none;box-shadow:none}
/* fokusda ramka o'rniga raqam ostida ingichka chiziq */
.amt-c::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:3px;border-radius:2px;background:var(--blue);transform:scaleX(0);opacity:0;transition:transform .22s ease,opacity .22s}
.amt-c:focus-within::after{transform:none;opacity:1}
.amt-c input::placeholder{color:var(--tx-3);opacity:.55}
.amt-c span{font-size:18px;font-weight:700;color:var(--tx-2)}
.amt-s{text-align:center;font-size:13.5px;color:var(--tx-2);min-height:20px;margin-bottom:14px;font-weight:500}
.amt-s.warn{color:var(--bad);font-weight:700}
.katrow{display:flex;align-items:center;gap:13px;width:100%;padding:13px 14px;border-radius:24px;border:1.5px solid var(--line);text-align:left;margin-top:16px;transition:background .12s}
.katrow:active{background:var(--card-2)}
.katrow .row-main small{font-size:12px;margin:0 0 1px}
.katrow .row-main b{font-size:16.5px}
#eOxirgi,#eTez{margin-top:10px}
@media(min-width:760px){ .sheet .chips.scroll{margin:0 -20px;padding:2px 20px} #eOxirgi,#eTez{margin-top:10px} }
.sheet .chips.scroll{margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px}
.sub-h{font-size:13.5px;font-weight:700;color:var(--tx-2);margin:22px 4px 10px}

/* ---------------- Toifa tanlagich ---------------- */
.srch{position:relative;margin-bottom:6px}
.srch .ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--tx-3);width:20px;height:20px;pointer-events:none}
.srch input{width:100%;height:52px;border-radius:26px;border:1.5px solid var(--line);background:var(--card-2);padding:0 18px 0 48px;font-size:16px;font-weight:600}
.srch input:focus,.srch input:focus-visible{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.srch input::-webkit-search-cancel-button{-webkit-appearance:none}
.kat-gh{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--tx-2);margin:18px 4px 10px}
.kat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kat-b{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:18px;background:var(--card-2);border:1.5px solid transparent;text-align:left;font-size:14px;font-weight:700;line-height:1.25;min-height:58px;min-width:0;transition:transform .1s}
.kat-b span:last-child{min-width:0;overflow-wrap:break-word}
.kat-b:active{transform:scale(.97)}
.kat-b.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 10%,transparent)}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:8px}
.icon-b{height:50px;border-radius:16px;display:grid;place-items:center;background:var(--card-2);color:var(--tx-2);border:1.5px solid transparent}
.icon-b.on{background:color-mix(in srgb,var(--g) 16%,transparent);border-color:var(--g);color:color-mix(in srgb,var(--g) 80%,var(--tx))}

/* ---------------- Taqvim ---------------- */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-nav b{font-size:17px;font-weight:800;letter-spacing:-.015em}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-w span{text-align:center;font-size:12px;font-weight:700;color:var(--tx-3);padding-bottom:4px}
.cal-d{aspect-ratio:1;border-radius:34%;display:grid;place-items:center;font-size:14.5px;font-weight:700;color:var(--tx);background:var(--h0);position:relative;border:2px solid transparent;font-variant-numeric:tabular-nums}
.cal-d.l1{background:var(--h1)} .cal-d.l2{background:var(--h2)} .cal-d.l3{background:var(--h3);color:#fff} .cal-d.l4{background:var(--h4);color:#fff}
[data-theme="dark"] .cal-d.l4{color:#0a0d2c} [data-theme="dark"] .cal-d.l1,[data-theme="dark"] .cal-d.l2{color:#fff}
.cal-d.today{border-color:var(--tx)}
.cal-d.on{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.cal-d:active{transform:scale(.93)}
.cal-leg{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;color:var(--tx-3);font-weight:600;margin-top:14px}
.cal-leg i{width:14px;height:14px;border-radius:5px;display:inline-block}
.cal-leg .l1{background:var(--h1)} .cal-leg .l2{background:var(--h2)} .cal-leg .l3{background:var(--h3)} .cal-leg .l4{background:var(--h4)}

/* Namuna ma'lumot / ko'rgazma tasmasi: tor ekranda tugma ikkinchi qatorga tushadi */
.demo-b{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:10px 12px 10px 10px;margin-bottom:12px;border-radius:20px;background:var(--card);border:1.5px dashed var(--line)}
.demo-t{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.demo-t>span:last-child{flex:1;min-width:0}
.demo-b b{display:block;font-size:14px;font-weight:800}
.demo-b small{display:block;font-size:12.5px;color:var(--tx-2);line-height:1.35}
.demo-b .btn{flex:0 0 auto;margin-left:auto}

/* ---------------- Kun chizig'i (vaqt bo'yicha) ---------------- */
.tl2{display:flex;flex-direction:column;margin:0 -4px}
.tl2-it,.tl2-gap,.tl2-now{display:grid;grid-template-columns:46px 58px minmax(0,1fr) auto;align-items:stretch;column-gap:10px;width:100%;text-align:left;padding:0 4px}
.tl2-t{font-size:12px;font-weight:700;color:var(--tx-3);padding-top:6px;display:flex;flex-direction:column;justify-content:space-between}
.tl2-t small{font-size:11.5px;font-weight:600;color:var(--tx-3);opacity:.75;padding-bottom:6px}
.tl2-rail{position:relative;display:flex;justify-content:center}
.tl2-rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:color-mix(in srgb,var(--g,var(--tx-3)) 30%,transparent);border-radius:2px}
.tl2-pill{position:relative;width:52px;border-radius:26px;display:grid;place-items:center;margin:4px 0;background:var(--g);color:#fff;box-shadow:0 8px 18px -10px var(--g)}
.tl2-pill .ic{width:22px;height:22px}
.tl2-m{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:8px 0}
.tl2-m small{font-size:12.5px;color:var(--tx-2);font-weight:600}
.tl2-m b{font-size:16.5px;font-weight:800;letter-spacing:-.015em;line-height:1.25;margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tl2-m em{font-style:normal;font-size:12.5px;color:var(--tx-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tl2-amt{align-self:center;font-weight:800;font-size:14.5px;color:var(--tx-2)}
.tl2-it:active .tl2-pill{transform:scale(.95)}
.tl2-gap{min-height:54px;--g:var(--tx-3)}
.tl2-gap .tl2-rail::before{background:none;border-left:3px dotted color-mix(in srgb,var(--tx-3) 55%,transparent);width:0;margin-left:-1.5px}
.tl2-gap .tl2-t{padding-top:0;justify-content:center;opacity:.8}
.tl2-gm{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--tx-2);font-weight:500;min-width:0}
.tl2-gm .ic{width:16px;height:16px;color:var(--tx-3);flex:0 0 auto}
.tl2-gm b{color:var(--blue-ink);font-weight:800}
.tl2-add{align-self:center;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-ink)}
.tl2-add .ic{width:18px;height:18px}
.tl2-gap.now .tl2-gm b{color:var(--warn)}
.tl2-gap:active{background:var(--card-2);border-radius:14px}
.tl2-now{min-height:22px;align-items:center;font-size:12px;font-weight:800;color:var(--bad)}
.tl2-now .tl2-t{color:var(--bad);padding:0;justify-content:center}
.tl2-now .tl2-rail::before{display:none}
.tl2-now .tl2-rail i{position:absolute;top:50%;left:-56px;right:-200vw;height:2px;background:var(--bad);opacity:.55}
.tl2-now .tl2-rail i::after{content:"";position:absolute;left:62px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}
.tl2{overflow:hidden}
.tl2-start{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:22px;border:1.5px dashed color-mix(in srgb,var(--blue) 50%,transparent);color:var(--blue-ink)}
.tl2-start>.ic{width:26px;height:26px;flex:0 0 auto}
.tl2-start b{display:block;font-size:15.5px;color:var(--tx)} .tl2-start small{display:block;font-size:12.5px;color:var(--tx-2);margin-top:2px;line-height:1.4}

/* ---------------- Hozir nima qilyapsiz ---------------- */
.hozir.on{border-color:color-mix(in srgb,var(--g) 45%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--g) 12%,var(--card)),var(--card) 70%)}
.hz-top{display:flex;align-items:center;gap:12px}
.hz-m{flex:1;min-width:0} .hz-m small{display:block;font-size:12.5px;color:var(--tx-2);font-weight:600}
.hz-m b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hz-t{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hozir .chips.scroll .chip{gap:8px;padding-left:6px}
.tile-ic.xs{width:28px;height:28px;border-radius:10px} .tile-ic.xs .ic{width:15px;height:15px}

/* ---------------- Vaqt tanlagich ---------------- */
.vt-f b{font-size:19px;font-weight:800;letter-spacing:.01em} .vt-f .ph{color:var(--tx-3);font-weight:700;font-size:18px}
.vt-top{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 6px}
.vt-disp{display:flex;align-items:center;gap:2px;font-size:54px;font-weight:800;letter-spacing:-.02em;line-height:1}
.vt-disp button{padding:4px 10px;border-radius:18px;color:var(--tx-3);transition:background .15s,color .15s}
.vt-disp button.on{color:var(--tx);background:var(--blue-soft)}
.vt-disp i{font-style:normal;color:var(--tx-3);margin-top:-6px}
.vt-hint{text-align:center;font-size:13px;color:var(--tx-2);margin-bottom:12px}
.vt-grid{display:grid;gap:8px}
.vt-grid.s{grid-template-columns:repeat(6,1fr)} .vt-grid.m{grid-template-columns:repeat(4,1fr)}
.vt-k{height:48px;border-radius:16px;background:var(--card-2);border:1px solid var(--line);font-size:17px;font-weight:700;color:var(--tx)}
.vt-k.on{background:var(--blue);border-color:var(--blue);color:#fff}
.vt-k.yaqin{border-color:var(--blue)}
.vt-k:active{transform:scale(.94)}
.vt-tav{margin-top:14px}

/* ============================================================
   Daftar, Fokus, Reja, Tahlil, Profil, AI
   ============================================================ */
/* Ikki raqamli xulosa (Orrin: Total left | Total raised) */
.duo{display:grid;grid-template-columns:1fr 1fr}
.duo>div{padding:2px 0 2px 16px;border-left:1px solid var(--line);min-width:0}
.duo>div:first-child{padding-left:0;border-left:none}
.duo small{display:block;font-size:13px;color:var(--tx-2);font-weight:600;margin-bottom:4px}
.duo b{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:normal;line-height:1.1}
.duo span{font-size:13px;color:var(--tx-2);font-weight:600;margin-left:5px}
.duo.big b{font-size:34px}
.rv{font-size:14px;font-weight:700;color:var(--tx-2);flex:0 0 auto;white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}

/* ---------------- Daftar ---------------- */
.day{padding:14px 14px 8px}
.day-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.day-d{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.day-d>b{width:46px;height:46px;border-radius:16px;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-size:19px;font-weight:800;flex:0 0 auto;letter-spacing:-.02em}
.day-d span{min-width:0}
.day-d span b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.01em;text-transform:capitalize}
.day-d span small{display:block;font-size:12.5px;color:var(--tx-2);font-weight:500}
.day-s{text-align:right;flex:0 0 auto}
.day-s b{display:block;font-size:16px;font-weight:800}
.day-s small{font-size:12px;color:var(--tx-3);font-weight:600}
.day .rows{margin-top:8px}
.day .stackbar{margin:0 2px}

/* ---------------- Fokus ---------------- */
.dial{position:relative;width:min(100%,340px);aspect-ratio:1;margin:-18px auto -26px;display:grid;place-items:center}
.dial-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orb{fill:none;stroke:var(--line);stroke-width:1.2}
.orb.o2{stroke:color-mix(in srgb,var(--blue) 26%,transparent)}
.star{fill:var(--blue-2);opacity:.75} .star.s2{fill:#3fdcc0} .star.s3{fill:var(--violet)}
.dial-track{fill:none;stroke:var(--card-3);stroke-width:14}
[data-theme="dark"] .dial-track{stroke:rgba(255,255,255,.08)}
.dial-arc{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.dial-dot{fill:#fff;stroke:#3f8ee8;stroke-width:4;transition:cx .3s linear,cy .3s linear}
.dial.live .dial-dot{filter:drop-shadow(0 0 8px rgba(63,142,232,.9))}
.dial-c{position:relative;text-align:center;padding:0 40px}
.dial-c small{display:block;font-size:13.5px;font-weight:700;color:var(--tx-2);margin-bottom:2px}
.dial-c b{display:block;font-size:clamp(46px,14vw,58px);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.dial-c span{display:block;font-size:14px;font-weight:600;color:var(--blue-ink);margin-top:4px;min-height:20px}
.f-ctl{display:flex;align-items:center;justify-content:center;gap:26px;margin:6px 0 2px}
.f-main{width:88px;height:88px;border-radius:30px;background:var(--grad-fab);color:#fff;display:grid;place-items:center;box-shadow:0 22px 36px -16px rgba(63,120,240,.9);transition:transform .16s cubic-bezier(.3,1.4,.5,1)}
.f-main:active{transform:scale(.93)}
.f-main .ic{width:36px;height:36px;fill:currentColor;stroke-width:1.5}
.f-main.on{background:var(--card);color:var(--tx);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.f-side{width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--tx-2)}
.f-side .ic{width:52px;height:52px;padding:15px;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--tx)}
.f-side.ok .ic{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.f-side:disabled{opacity:.38}
.f-side:active:not(:disabled) .ic{transform:scale(.93)}
.f-side.ghost{visibility:hidden}

/* ---------------- Reja ---------------- */
.bud .row-main b{margin-bottom:7px}
.bmeter{display:block;position:relative;height:8px;border-radius:4px;background:color-mix(in srgb,var(--g) 15%,transparent);margin-bottom:6px}
.bmeter i{display:block;height:100%;border-radius:4px;background:var(--g);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bmeter s{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--tx);transform:translateX(-50%);box-shadow:0 0 0 2px var(--card)}
.row-amt small .pill{height:22px;padding:0 8px;font-size:11.5px;margin-top:3px}
.key-bar{display:inline-block;width:18px;height:7px;border-radius:4px;background:var(--blue);vertical-align:middle;margin-right:4px}
.key-mark{display:inline-block;width:3px;height:14px;border-radius:2px;background:var(--tx);vertical-align:middle;margin-right:6px}
.row .meter{display:block;margin:6px 0 2px}
.jm .row-main b{margin-bottom:0}
.kr-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;margin-top:10px}
.kr-grid .field>span{display:inline-flex;align-items:center;gap:6px}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .tile-h{justify-content:space-between}
.goal>b{font-size:14.5px;font-weight:700;line-height:1.3;margin-top:6px;letter-spacing:-.01em}
.goal>small{white-space:normal}
.goal .meter{display:block;margin-top:6px}
.goal.met{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:14px 6px 12px;border-radius:20px;background:var(--card-2);border:1px solid transparent}
.badge span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card-3);color:var(--tx-3);margin-bottom:5px}
.badge b{font-size:13px;font-weight:800;color:var(--tx-2);letter-spacing:-.01em}
.badge small{font-size:11.5px;color:var(--tx-3);font-weight:500;line-height:1.3}
.badge.ha{background:var(--warn-soft);border-color:color-mix(in srgb,var(--gold) 55%,transparent)}
.badge.ha span{background:linear-gradient(140deg,#ffe29a,var(--gold));color:#4a3200;box-shadow:0 8px 16px -8px rgba(242,178,58,.8)}
.badge.ha b{color:var(--tx)}

/* ---------------- Tahlil ---------------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(min-width:900px){ .kpis{grid-template-columns:repeat(4,1fr);gap:16px} }
.kpi .tile-v{margin-top:10px}
.kpi .tile-v b{font-size:24px}
.kpi>small{white-space:normal;line-height:1.35;min-height:34px}
.kpi .pill{margin-top:8px}
.rank{display:flex;flex-direction:column;gap:13px}
.rank-r{display:grid;grid-template-columns:1fr auto 40px;align-items:center;gap:6px 10px;font-size:14.5px}
.rank-n{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-b{grid-column:1/-1;grid-row:2;height:10px;border-radius:5px;background:var(--card-2);overflow:hidden}
.rank-b i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--g);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.rank-r b{font-weight:800;text-align:right}
.rank-r small{text-align:right;color:var(--tx-3);font-weight:600;font-size:12.5px}
.chart .ch{align-items:flex-start;margin-bottom:8px}
.chart .ch .hint{display:block;margin-top:2px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px;font-size:12.5px;font-weight:600;color:var(--tx-2)}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.chartbox{position:relative;height:240px}
.chart.jadval .chartbox,.chart.jadval .lgd{display:none}
.chart:not(.jadval) .tbl-w{display:none}
.tbl-w{overflow-x:auto;max-height:320px;overflow-y:auto;border-radius:14px;border:1px solid var(--line)}
.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
.tbl thead th{position:sticky;top:0;background:var(--card-2);font-weight:700;color:var(--tx-2);font-size:12px}
.tbl th:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:var(--card)}
.tbl thead th:first-child{background:var(--card-2);z-index:1}
.tbl tr:last-child td,.tbl tr:last-child th{border-bottom:none}
.finds{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.finds p{font-size:13.5px;color:var(--tx-2);line-height:1.5;padding-left:14px;position:relative}
.finds p::before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.finds b{color:var(--tx);font-weight:700}
.adv{display:flex;flex-direction:column}
.adv-r{display:flex;gap:13px;align-items:flex-start;padding:13px 0}
.adv-r+.adv-r{border-top:1px solid var(--line-2)}
.adv-r h3{font-size:15px;font-weight:800;letter-spacing:-.01em;margin-bottom:3px}
.adv-r p{font-size:13.5px;color:var(--tx-2);line-height:1.5}
.adv-r p b{color:var(--tx);font-weight:700}
.yil-nav{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.yil-nav b{font-size:15px;font-weight:800;min-width:42px;text-align:center}
.yil-nav .ibtn{width:36px;height:36px}
.yil-nav .ibtn:disabled{opacity:.3}
.hm-w{overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.hm-w::-webkit-scrollbar{display:none}
.hm-m,.hm{display:flex;gap:3px;min-width:max-content}
.hm-m span{flex:0 0 13px;width:13px;font-size:10.5px;color:var(--tx-3);font-weight:600;white-space:nowrap;overflow:visible;height:16px}
.hm-c{display:flex;flex-direction:column;gap:3px}
.hm i{width:13px;height:13px;border-radius:4px;background:var(--h0);cursor:pointer;display:block}
.hm i.l1{background:var(--h1)} .hm i.l2{background:var(--h2)} .hm i.l3{background:var(--h3)} .hm i.l4{background:var(--h4)}
.hm i.today{outline:2px solid var(--tx);outline-offset:1px}
.hm i.void{background:transparent;cursor:default}
/* Haftalik hisobot: 7 kunlik tasma */
.hk{display:flex;flex-direction:column;gap:2px}
.hk-r{display:grid;grid-template-columns:46px minmax(0,1fr) 52px;align-items:center;gap:10px;padding:7px 4px;border-radius:14px;text-align:left}
.hk-r:active{background:var(--card-2)}
.hk-d{display:flex;align-items:baseline;gap:5px}
.hk-d b{font-size:13.5px;font-weight:800}
.hk-d small{font-size:12.5px;color:var(--tx-3);font-weight:600}
.hk-r .stackbar{margin:0;height:10px;border-radius:5px}
.hk-v{text-align:right;font-size:13.5px;font-weight:800}
@media(max-width:899px){ #scr-daftar.qidiruv .dsum{display:none} }
.hisobot{white-space:pre-wrap;font:inherit;font-size:14.5px;line-height:1.7;background:var(--card-2);border:1px solid var(--line);border-radius:22px;padding:16px 18px;color:var(--tx)}
.yilk{border-radius:28px;padding:24px 22px;color:#fff;background:
  radial-gradient(120% 90% at 0% 0%,rgba(44,68,216,.95) 0%,transparent 60%),radial-gradient(90% 80% at 100% 0%,rgba(26,141,153,.75) 0%,transparent 58%),#07092a}
.yilk-h{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.yilk-h svg{width:46px;height:46px;border-radius:14px}
.yilk-h b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.yilk-h small{font-size:13px;opacity:.78}
.yilk-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yilk-g div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:14px 16px;min-width:0}
.yilk-g b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yilk-g b.matn{font-size:19px;white-space:normal;line-height:1.2;min-height:28px;display:flex;align-items:flex-end}
.yilk-g span{font-size:12.5px;opacity:.78}
.yilk p{font-size:13px;opacity:.8;margin-top:16px;line-height:1.5}

/* ---------------- Profil ---------------- */
.acc-top{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.acc-top>div{flex:1;min-width:0}
.acc-top b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-top small{display:block;font-size:13.5px;color:var(--tx-2);line-height:1.35;overflow-wrap:anywhere}
.sync-card{display:flex;gap:13px;align-items:flex-start;padding:14px;border-radius:22px;background:var(--card-2);border:1px solid var(--line-2)}
.sync-card h3{font-size:15.5px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.sync-card p{font-size:13.5px;color:var(--tx-2);line-height:1.45}
.sync-card small{display:block;font-size:12.5px;color:var(--tx-3);margin-top:6px;font-weight:600;line-height:1.45}
.sync-card.busy .tile-ic .ic{animation:spin 1s linear infinite}
.tin{flex:0 0 auto;height:42px;padding:0 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card-2);font-size:16px;font-weight:700}
.kod{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;border-radius:24px;background:var(--blue-soft);margin:16px 0 4px}
.kod b{font-size:24px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--blue-ink);user-select:all;-webkit-user-select:all}
.ver{display:flex;align-items:center;gap:12px;margin:4px 4px 0}
.ver b{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:normal;word-spacing:normal}
.page .card .ch h2{display:flex;align-items:center}

/* ---------------- AI yordamchi ---------------- */
.ai-sheet .sheet-b{display:flex;flex-direction:column;gap:10px;padding-bottom:10px}
.ai-msgs{flex:1 1 auto;display:flex;flex-direction:column;gap:9px;min-height:120px}
.ai-m{max-width:86%;padding:11px 15px;border-radius:20px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.ai-m.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:7px}
.ai-m.ai{align-self:flex-start;background:var(--card-2);border:1px solid var(--line-2);border-bottom-left-radius:7px}
.ai-m.typing{display:flex;gap:5px;padding:15px 16px}
.ai-m.typing i{width:7px;height:7px;border-radius:50%;background:var(--tx-3);animation:pulse 1.1s ease-in-out infinite}
.ai-m.typing i:nth-child(2){animation-delay:.18s} .ai-m.typing i:nth-child(3){animation-delay:.36s}
.ai-hello{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin:auto;padding:20px 10px;max-width:330px}
.ai-hello .tile-ic{width:64px;height:64px;border-radius:22px}
.ai-hello .tile-ic .ic{width:30px;height:30px}
.ai-hello p{font-size:15px;color:var(--tx-2);line-height:1.5}
.ai-sheet .chips .chip{white-space:normal;text-align:left;height:auto;min-height:38px;padding:8px 14px;line-height:1.3}
.ai-vb{border:1.5px solid var(--blue);border-radius:22px;padding:10px 12px 12px;background:var(--blue-soft)}
.ai-vb .row{padding:7px 2px}
.ai-sheet .sheet-f{align-items:flex-end}
.ai-sheet textarea{flex:1;min-height:50px;max-height:120px;resize:none;border-radius:25px;border:1.5px solid var(--line);background:var(--card-2);padding:13px 18px;font-size:16px;line-height:1.4;font-weight:500}
.ai-sheet textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.ai-send{width:50px;height:50px;border-radius:50%;background:var(--grad-fab);color:#fff;display:grid;place-items:center;flex:0 0 auto;transition:transform .12s}
.ai-send:active{transform:scale(.92)}
.ai-send:disabled{opacity:.45}

</style>
</head>

function isoOf(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function bugunISO(){ return isoOf(new Date()); }
function dOf(iso){ const p = String(iso).split("-"); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); }
function addDays(iso, n){ const d = dOf(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function isIso(s){ return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function oyKey(iso){ return String(iso || "").slice(0, 7); }
function hozirDaqiqa(){ const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }
function hhmm(min){ min = ((Math.round(min) % 1440) + 1440) % 1440; return String(Math.floor(min / 60)).padStart(2, "0") + ":" + String(min % 60).padStart(2, "0"); }
function hmToMin(v){ if(!v || !/^\d{2}:\d{2}$/.test(v)) return null; const p = v.split(":"); return (+p[0]) * 60 + (+p[1]); }

// ---- Format ----
function tanga(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
function soat(n){ n = Math.round(n); const neg = n < 0; n = Math.abs(n); const h = Math.floor(n / 60), m = n % 60; return (neg ? "−" : "") + (h > 0 ? (m > 0 ? `${h}s ${m}d` : `${h}s`) : `${m}d`); }
function soatUzun(n){ n = Math.max(0, Math.round(n)); const h = Math.floor(n / 60), m = n % 60; return h > 0 ? (m > 0 ? `${h} soat ${m} daqiqa` : `${h} soat`) : `${m} daqiqa`; }
function soatF(n){ return (n / 60).toFixed(1); }
function somF(n){ return tanga(Math.round(n)) + " so'm"; }
function foiz(a, b){ return b ? Math.round(a / b * 100) : 0; }
function sanaQisqa(iso){ const d = dOf(iso); return `${d.getDate()}-${OYLAR[d.getMonth()]}`; }
function sanaToliq(iso){ const d = dOf(iso); return `${d.getDate()}-${OYLAR[d.getMonth()]}, ${HK_TOLIQ[d.getDay()]}`; }
function sanaNisbiy(iso){ const t = bugunISO(); if(iso === t) return "Bugun"; if(iso === addDays(t, -1)) return "Kecha"; if(iso === addDays(t, 1)) return "Ertaga"; return sanaToliq(iso); }
function oyNomi(key){ const p = key.split("-"); return OY_TOLIQ[+p[1] - 1] + " " + p[0]; }

async function vbHash(str){
  try{ if(window.crypto && crypto.subtle){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("vb1:" + str)); return "s" + Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join(""); } }catch(e){}
  let h = 5381; const s = "vb1:" + str; for(let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return "f" + h.toString(16);
}
// Matnni buferga nusxalaydi → Promise<boolean>. Clipboard API rad etsa — eski usul (yashirin maydon) bilan.
async function nusxala(matn){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(matn); return true; } }catch(e){}
  try{
    const t = document.createElement("textarea"); t.value = matn; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;left:-999px;top:0;opacity:0";
    document.body.appendChild(t); t.select(); const ok = document.execCommand("copy"); t.remove(); return !!ok;
  }catch(e){ return false; }
}

function faylBer(nom, data, tur){
  const blob = data instanceof Blob ? data : new Blob([data], {type: tur || "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  return Promise.resolve(true);
}

function latKir(str){
  let s = String(str);
  s = s.replace(/(^|[\s(«"'‘“])e/g, "$1э").replace(/(^|[\s(«"'‘“])E/g, "$1Э");
  s = s.replace(/(^|[^a-zA-Zʻ']|[aeiouAEIOU])ye/g, "$1е").replace(/(^|[^a-zA-Zʻ'])Y[eE]/g, "$1Е");   // so'z boshida va unlidan keyin: yetti -> етти, qayerga -> қаерга
  for(const p of _K) s = s.split(p[0]).join(p[1]);
  return s;
}
function kirilmi(){ return S.sozlama.alifbo === "kiril"; }
function cyrPass(root){
  if(!kirilmi() || !root) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      const p = n.parentNode;
      if(!p) return NodeFilter.FILTER_REJECT;
      const nn = p.nodeName;
      if(nn === "SCRIPT" || nn === "STYLE" || nn === "TEXTAREA") return NodeFilter.FILTER_REJECT;
      if(p.closest && p.closest("[data-nokir]")) return NodeFilter.FILTER_REJECT;
      return /[a-zA-Z]/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
    }});
  const list = []; while(w.nextNode()) list.push(w.currentNode);
  for(const n of list) n.nodeValue = latKir(n.nodeValue);
  $$("input[placeholder],textarea[placeholder]", root).forEach(i => { if(/[a-zA-Z]/.test(i.placeholder)) i.placeholder = latKir(i.placeholder); });
}

function navbatSoni(){ return Object.keys(Meta.out).length; }
